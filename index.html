// ================= eventos das telas =================
function bindView() {
  const v = $("#view");
  v.onclick = (e) => {
    const t = e.target.closest("button, [data-tx], [data-rem], [data-debt], [data-go]");
    if (!t) return;
    const d = t.dataset;
    if (d.paydebt) return openDebtPaySheet(db.debts.find((x) => x.id === d.paydebt));
    if (d.debt) return openDebtDetail(db.debts.find((x) => x.id === d.debt));
    if (d.dsort) { ui.debtSort = d.dsort; return render(); }
    if (d.go) return go(d.go);
    if (d.cols) { ui.cols = d.cols; return render(); }
    if (d.done) return completeRem(d.done);
    if (d.snooze) return snoozeRem(d.snooze, 60);
    if (d.tx) return openTxSheet(db.tx.find((x) => x.id === d.tx));
    if (d.rem) return openRemSheet(db.rem.find((x) => x.id === d.rem));
    if (d.cat) { ui.filter = d.cat; ui.search = ""; if (ui.tab !== "extrato") { ui.y = now().getFullYear(); ui.m = now().getMonth(); } return go("extrato"); }
    if (d.month) { const dt = new Date(ui.y, ui.m + Number(d.month), 1); ui.y = dt.getFullYear(); ui.m = dt.getMonth(); ui.filter = null; return render(); }
    if ("filter" in d) { ui.filter = d.filter || null; return render(); }
    if (d.delcat) return removeCategory(...d.delcat.split("|"));
    if (d.addcat) return openCategorySheet(d.addcat);
    if (d.snap) return restoreSnapshot(d.snap);
    switch (t.id) {
      case "settings": return go("mais");
      case "new-debt": return openDebtSheet();
      case "privacy":
        ui.private = !ui.private;
        try { localStorage.setItem(PRIV_KEY, ui.private ? "1" : "0"); } catch {}
        return render();
      case "ask-notif": return askNotifications();
      case "all-cal": return addToCalendar(db.rem.filter((r) => !r.done));
      case "export": return exportBackup();
      case "import": return $("#import-file").click();
      case "csv": return exportCSV();
      case "install": return installPrompt?.prompt();
      case "check-update": return checkUpdate(true);
      case "wipe": return openWipeSheet();
    }
  };
  v.onkeydown = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-rem], [data-debt], [data-go]:not(button)")) { e.preventDefault(); e.target.click(); } };

  const q = $("#q");
  if (q) {
    const prev = () => { ui.quick = q.value; renderPreview(); };
    q.addEventListener("input", prev);
    $("#quick").addEventListener("submit", (e) => { e.preventDefault(); saveQuick(); });
    setupMic();
    renderPreview();
  }
  const s = $("#search");
  if (s) s.addEventListener("input", () => { ui.search = s.value; const pos = s.selectionStart; render(); const n = $("#search"); n.focus(); n.setSelectionRange(pos, pos); });

  $$("[data-budget]").forEach((inp) => inp.addEventListener("change", () => {
    const v = inp.value.trim();
    if (!v) delete db.budgets[inp.dataset.budget];
    else {
      const cents = parseMoney(v);
      if (!cents) { toast("Valor inválido. Ex.: 800 ou 800,00"); return; }
      db.budgets[inp.dataset.budget] = cents;
    }
    persist();
    toast("Orçamento salvo.");
  }));
}

// ================= entrada rápida =================
function currentParse() {
  const text = ($("#q")?.value || "").trim();
  return text ? parseQuick(text, now(), catsForParse()) : null;
}
function renderPreview() {
  const box = $("#qprev"), hint = $("#qhint");
  if (!box) return;
  const text = ($("#q").value || "").trim();
  const p = currentParse();
  hint.hidden = !!text;
  if (!text) { box.innerHTML = ""; return; }
  if (!p) {
    box.innerHTML = `<p class="small muted">Não achei um valor. Ex.: “mercado 50” ou “me lembra amanhã 9h…”. <button class="link" id="q-form">Abrir formulário</button></p>`;
    $("#q-form").onclick = () => openTxSheet({ desc: text });
    return;
  }
  const dq = quickDebt(p, text);
  if (dq) {
    const t = p.items[0], c = debtCalc(dq);
    box.innerHTML = `<div class="preview-item"><span class="pill strong">💳 Pagamento: ${esc(dq.name)}</span><span class="pill">${brl(t.cents)}</span><span class="pill">${fmtDay(t.date)}</span>
      <span class="pill">falta ${brl(Math.max(0, c.remaining - t.cents))} depois</span></div>
      <div class="preview-actions"><button class="btn primary" id="q-save">Registrar pagamento</button><button class="btn" id="q-nodebt">Não é dívida</button></div>`;
    $("#q-save").onclick = saveQuick;
    $("#q-nodebt").onclick = () => { ui.quickNoDebt = text; renderPreview(); };
    return;
  }
  if (p.type === "tx") {
    box.innerHTML = p.items.map((t) => `<div class="preview-item">
      <span class="pill strong ${t.kind === "receita" ? "inc" : ""}">${t.kind === "receita" ? "Receita" : "Despesa"} ${brl(t.cents)}</span>
      <span class="pill">${catOf(t.kind, t.category).icon} ${esc(t.category)}</span>
      <span class="pill">${fmtDay(t.date)}</span>
      ${t.desc ? `<span class="pill">${esc(t.desc)}</span>` : ""}${t.pay ? `<span class="pill">${esc(t.pay)}</span>` : ""}</div>`).join("") +
      `<div class="preview-actions"><button class="btn primary" id="q-save">Salvar${p.items.length > 1 ? ` os ${p.items.length}` : ""}</button>${p.items.length === 1 ? `<button class="btn" id="q-edit">Ajustar</button>` : ""}</div>`;
  } else {
    box.innerHTML = `<div class="preview-item"><span class="pill strong">⏰ ${esc(p.text)}</span><span class="pill">${fmtWhen(p.when)}</span>
      ${p.rec !== "nenhuma" ? `<span class="pill">${RECURRENCES[p.rec].toLowerCase()}</span>` : ""}${p.cents ? `<span class="pill">${brl(p.cents)}</span>` : ""}</div>
      <div class="preview-actions"><button class="btn primary" id="q-save">Criar lembrete</button><button class="btn" id="q-edit">Ajustar</button></div>`;
  }
  $("#q-save").onclick = saveQuick;
  const ed = $("#q-edit");
  if (ed) ed.onclick = () => {
    if (p.type === "tx") openTxSheet({ ...p.items[0] }, { fromQuick: true });
    else openRemSheet({ text: p.text, start: p.when, rec: p.rec, cents: p.cents }, { fromQuick: true });
  };
}
function quickDebt(p, text) {
  if (!p || p.type !== "tx" || p.items.length !== 1 || p.items[0].kind !== "despesa" || ui.quickNoDebt === text) return null;
  return matchDebt(text);
}
function clearQuick() { ui.quick = ""; const q = $("#q"); if (q) { q.value = ""; renderPreview(); } }
function saveQuick() {
  const p = currentParse();
  if (!p) { if (($("#q")?.value || "").trim()) openTxSheet({ desc: $("#q").value.trim() }); return; }
  const dq = quickDebt(p, ($("#q")?.value || "").trim());
  if (dq) {
    payDebt(dq.id, p.items[0].cents, p.items[0].date, true);
    clearQuick();
    return;
  }
  if (p.type === "tx") {
    for (const t of p.items) saveTx({ ...t }, { silent: p.items.length > 1 });
    clearQuick();
    if (p.items.length > 1) toast(`✅ ${p.items.length} lançamentos salvos.`);
    else if (!document.querySelector(".toast")) toast(`✅ ${p.items[0].kind === "receita" ? "Receita" : "Despesa"} de ${brl(p.items[0].cents)} salva.`, { action: "Desfazer", onAction: () => deleteLast(1) });
  } else {
    saveRem({ text: p.text, start: p.when, rec: p.rec, cents: p.cents || null });
    clearQuick();
    toast(`⏰ Lembrete para ${fmtWhen(p.when)}.`);
  }
}
function deleteLast(n) { const ids = [...db.tx].sort((a, b) => (b.created || 0) - (a.created || 0)).slice(0, n).map((t) => t.id); db.tx = db.tx.filter((t) => !ids.includes(t.id)); commit(); }

// ditado por voz (quando o navegador oferece; o microfone do teclado também funciona)
let recog = null;
function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $("#mic");
  if (!SR || !btn) return;
  btn.hidden = false;
  btn.onclick = () => {
    if (recog) { recog.stop(); return; }
    recog = new SR();
    recog.lang = "pt-BR"; recog.interimResults = true; recog.maxAlternatives = 1;
    btn.classList.add("listening");
    recog.onresult = (e) => {
      const text = [...e.results].map((r) => r[0].transcript).join(" ");
      $("#q").value = text; ui.quick = text; renderPreview();
    };
    recog.onerror = (e) => {
      if (e.error === "network") toast("O ditado do navegador precisa de internet. Use o microfone do teclado, que funciona offline.", { ms: 6000 });
      else if (e.error === "not-allowed") toast("Permita o uso do microfone para ditar.");
    };
    recog.onend = () => { btn.classList.remove("listening"); recog = null; };
    recog.start();
  };
}

// ================= dívidas (controle separado, ligado ao extrato e aos lembretes) =================
const DEBT_ICONS = ["💳", "🏦", "🚗", "🏠", "📱", "🎓", "🧾", "🤝", "🛒", "⚕️"];

function debtCalc(dv) {
  const paid = dv.payments.reduce((a, p) => a + p.cents, 0);
  const adj = (dv.adjust || []).reduce((a, x) => a + x.cents, 0);
  const total = Math.max(0, dv.total + adj);
  const remaining = Math.max(0, total - paid);
  const pct = total ? Math.min(100, Math.round((100 * paid) / total)) : 100;
  const done = remaining === 0;
  const inst = dv.installment || 0;
  const instPaid = inst ? Math.min(dv.installments || Infinity, Math.floor((paid + inst * 0.05) / inst)) : null;
  const t = now(), y = t.getFullYear(), m = t.getMonth();
  const paidThisMonth = dv.payments.some((p) => p.date.startsWith(monthKey(y, m)) && !p.initial);
  let nextDue = null, late = false;
  if (dv.dueDay && !done) {
    const dayThis = Math.min(dv.dueDay, Core.lastDayOfMonth(y, m));
    if (paidThisMonth) nextDue = new Date(y, m + 1, Math.min(dv.dueDay, Core.lastDayOfMonth(y, m + 1)));
    else {
      nextDue = new Date(y, m, dayThis);
      late = t.getDate() > dayThis;
    }
  }
  const monthsLeft = inst && !done ? Math.ceil(remaining / inst) : null;
  const payoff = monthsLeft ? new Date(y, m + monthsLeft - (paidThisMonth ? 0 : 1), 1) : null;
  return { paid, adj, total, remaining, pct, done, instPaid, nextDue, late, monthsLeft, payoff, paidThisMonth };
}
const debtsActive = () => db.debts.filter((dv) => !debtCalc(dv).done);
const debtsDone = () => db.debts.filter((dv) => debtCalc(dv).done);
const monYY = (d) => `${MONTHS[d.getMonth()].slice(0, 3)}/${String(d.getFullYear()).slice(2)}`;
const ddmm = (d) => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;

function debtTotals() {
  let remaining = 0, paid = 0, total = 0, late = 0;
  for (const dv of db.debts) {
    const c = debtCalc(dv);
    if (c.done) continue;
    remaining += c.remaining; paid += c.paid; total += c.total; if (c.late) late++;
  }
  return { remaining, paid, total, late, pct: total ? Math.round((100 * paid) / total) : 0 };
}

function syncDebtReminder(dv) {
  const c = debtCalc(dv);
  const r = db.rem.find((x) => x.debtId === dv.id);
  if (!dv.remind || !dv.dueDay || c.done) {
    if (r && !r.done) { r.done = true; r.next = null; }
    return;
  }
  const due = c.nextDue;
  const start = fmtLocal(new Date(due.getFullYear(), due.getMonth(), due.getDate(), 9, 0));
  const data = { text: `Pagar ${dv.name}`, start, next: start, rec: "mensal", cents: dv.installment || null, debtId: dv.id, done: false, snooze: null, notifiedFor: null };
  if (r) Object.assign(r, data); else db.rem.push({ id: uid(), created: Date.now(), ...data });
}

function saveDebt(dv) {
  const i = db.debts.findIndex((x) => x.id === dv.id);
  if (i >= 0) db.debts[i] = dv; else db.debts.push(dv);
  syncDebtReminder(dv);
  commit();
}

function payDebt(id, cents, date, asExpense, note = "") {
  const dv = db.debts.find((x) => x.id === id);
  if (!dv) return;
  const wasDone = debtCalc(dv).done;
  const pay = { id: uid(), date, cents, note };
  if (asExpense) {
    const tx = { id: uid(), created: Date.now(), kind: "despesa", cents, category: db.cats.despesa.some((c) => c.name === "dívidas") ? "dívidas" : "outros", desc: dv.name, date, pay: "", debtId: dv.id, payId: pay.id };
    db.tx.push(tx);
    pay.txId = tx.id;
  }
  dv.payments.push(pay);
  syncDebtReminder(dv);
  commit();
  const c = debtCalc(dv);
  const undo = () => deletePayment(dv.id, pay.id, { quiet: true });
  if (c.done && !wasDone) toast(`🎉 ${dv.name} quitada! Parabéns!`, { action: "Desfazer", onAction: undo, ms: 7000 });
  else toast(`✅ Pagamento de ${brl(cents)} registrado. Falta ${brl(c.remaining)}.`, { action: "Desfazer", onAction: undo, ms: 6000 });
}

function deletePayment(debtId, payId, { quiet } = {}) {
  const dv = db.debts.find((x) => x.id === debtId);
  if (!dv) return;
  const p = dv.payments.find((x) => x.id === payId);
  if (!p) return;
  dv.payments = dv.payments.filter((x) => x.id !== payId);
  const tx = p.txId ? db.tx.find((t) => t.id === p.txId) : null;
  if (tx) db.tx = db.tx.filter((t) => t.id !== tx.id);
  syncDebtReminder(dv);
  commit();
  if (!quiet) toast("Pagamento apagado.", { action: "Desfazer", onAction: () => { dv.payments.push(p); if (tx) db.tx.push(tx); syncDebtReminder(dv); commit(); } });
}

function deleteDebt(id) {
  const i = db.debts.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [removed] = db.debts.splice(i, 1);
  const rems = db.rem.filter((r) => r.debtId === id);
  db.rem = db.rem.filter((r) => r.debtId !== id);
  commit();
  toast(`Dívida “${removed.name}” apagada.`, { action: "Desfazer", onAction: () => { db.debts.splice(i, 0, removed); db.rem.push(...rems); commit(); } });
}

/** Acha uma dívida citada numa frase ("paguei 300 do empréstimo"). */
function matchDebt(text) {
  const f = fold(text);
  for (const dv of debtsActive()) {
    const words = fold(`${dv.name} ${dv.creditor || ""}`).split(/[^a-z0-9]+/).filter((w) => w.length >= 4);
    if (words.some((w) => new RegExp("\\b" + w + "\\b").test(f))) return dv;
  }
  return null;
}

function debtCard(dv) {
  const c = debtCalc(dv);
  const subParts = [dv.creditor, dv.dueDay ? `vence dia ${dv.dueDay}` : ""].filter(Boolean);
  const status = c.done ? `<span class="status good">quitada</span>`
    : c.late ? `<span class="status crit">atrasada</span>`
    : c.paidThisMonth && dv.dueDay ? `<span class="status good">paga este mês</span>` : "";
  const foot = [
    dv.installments ? `${c.instPaid} de ${dv.installments} parcelas` : dv.installment ? `parcela ${brl(dv.installment)}` : "",
    c.payoff ? `quita em ${monYY(c.payoff)}` : "",
  ].filter(Boolean).join(" · ");
  return `<div class="debt ${c.done ? "is-done" : ""}" data-debt="${dv.id}" role="button" tabindex="0">
    <div class="debt-top"><span class="ico" aria-hidden="true">${dv.icon || "💳"}</span>
      <span class="main"><span class="title">${esc(dv.name)}</span><span class="sub">${esc(subParts.join(" · ") || "sem vencimento definido")}</span></span>${status}</div>
    <div class="debt-mid">
      <div><span class="k">${c.done ? "Pago" : "Falta pagar"}</span><span class="v money">${brl(c.done ? c.paid : c.remaining)}</span></div>
      <div class="r"><span class="k">${c.pct}% pago</span><span class="v2 money">${brl(c.paid)} de ${brl(c.total)}</span></div>
    </div>
    <span class="track debt-track"><span class="fill debt-fill" style="width:${c.pct}%"></span></span>
    ${!c.done ? `<div class="debt-foot"><span class="small muted">${esc(foot || "Toque para ver o histórico")}</span><button class="btn primary sm" data-paydebt="${dv.id}">Pagar</button></div>` : ""}
  </div>`;
}

function viewDividas() {
  const active = debtsActive();
  const done = debtsDone();
  const T = debtTotals();
  const sorters = {
    menor: (a, b) => debtCalc(a).remaining - debtCalc(b).remaining,
    maior: (a, b) => debtCalc(b).remaining - debtCalc(a).remaining,
    venc: (a, b) => (debtCalc(a).nextDue || 9e15) - (debtCalc(b).nextDue || 9e15),
  };
  const sorted = [...active].sort(sorters[ui.debtSort] || sorters.venc);
  const nextOne = [...active].filter((dv) => debtCalc(dv).nextDue).sort(sorters.venc)[0];
  const monthly = active.reduce((a, dv) => a + (dv.installment || 0), 0);
  return `
  <header class="top">
    <div><p class="hello">Controle separado</p><h1>Dívidas</h1></div>
    <button class="icon-btn ghost" id="settings" aria-label="Configurações">${ICON.gear}</button>
  </header>

  ${db.debts.length ? `
  <section class="hero debt-hero">
    <div class="hero-top"><span class="eyebrow">Falta pagar</span>${T.late ? `<span class="delta">⚠️ ${T.late} atrasada${T.late > 1 ? "s" : ""}</span>` : `<span class="delta">${active.length} ativa${active.length !== 1 ? "s" : ""}</span>`}</div>
    <span class="big money">${brl(T.remaining)}</span>
    <div class="hero-split">
      <div><span class="k">Já pago</span><span class="v money">${brl(T.paid)}</span></div>
      <div><span class="k">Parcelas por mês</span><span class="v money">${monthly ? brl(monthly) : "—"}</span></div>
    </div>
    <div class="hero-meter"><span>${T.total ? `Você já pagou ${T.pct}% das dívidas ativas` : "Todas as dívidas quitadas 🎉"}</span><span class="track"><span class="fill" style="width:${T.pct}%"></span></span></div>
  </section>
  ${nextOne ? `<div class="alert ${debtCalc(nextOne).late ? "crit" : "info"}">📅 <span>${debtCalc(nextOne).late ? "Atrasada" : "Próximo vencimento"}: <b>${esc(nextOne.name)}</b> em ${ddmm(debtCalc(nextOne).nextDue)}${nextOne.installment ? ` · <span class="money">${brl(nextOne.installment)}</span>` : ""}</span></div>` : ""}
  ${active.length > 1 ? `<div class="chips" role="group" aria-label="Ordenar">
    ${[["venc", "Vencimento"], ["menor", "Menor saldo"], ["maior", "Maior saldo"]].map(([k, l]) => `<button class="chip" data-dsort="${k}" aria-pressed="${(ui.debtSort || "venc") === k}">${l}</button>`).join("")}
  </div>` : ""}
  <div class="debts">${sorted.map(debtCard).join("")}</div>
  ${done.length ? `<details class="card"><summary><h2 style="display:inline">Quitadas (${done.length}) 🎉</h2></summary><div class="debts" style="margin-top:12px">${done.map(debtCard).join("")}</div></details>` : ""}
  <div class="alert info">💡 <span><b>Dica:</b> pagar primeiro a <b>menor</b> dívida dá motivação (bola de neve); pagar primeiro a de <b>maior juros</b> economiza mais dinheiro.</span></div>
  ` : `
  <section class="card empty-state">
    <span class="big-ico" aria-hidden="true">💳</span>
    <h2>Controle suas dívidas aqui</h2>
    <p class="muted">Cadastre empréstimos, cartão, financiamentos ou dinheiro que você deve a alguém. A cada pagamento, o app atualiza quanto falta, mostra quando você quita e lança a despesa no extrato.</p>
    <button class="btn primary" id="new-debt">Adicionar minha primeira dívida</button>
  </section>`}`;
}

      </div>
      <div class="two">
        <label class="field"><span>Dia do vencimento</span><input id="d-day" inputmode="numeric" placeholder="1 a 31" value="${d.dueDay || ""}"></label>
        ${editing ? "<span></span>" : `<label class="field"><span>Já paguei (opcional)</span><input id="d-paid" inputmode="decimal" placeholder="0,00"></label>`}
      </div>
      <label class="check"><input type="checkbox" id="d-rem" ${d.remind !== false ? "checked" : ""}> <span>Lembrar todo mês no dia do vencimento</span></label>
      <label class="field"><span>Observação (juros, combinado…)</span><input id="d-note" value="${esc(d.note || "")}"></label>
      <p class="small muted" id="d-help">Dica: se souber só as parcelas, preencha nº e valor da parcela que o total é calculado.</p>
      <div class="actions"><button class="btn primary">${editing ? "Salvar" : "Adicionar dívida"}</button></div>
    </form>`, (root) => {
    const drawIcons = () => {
      root.querySelector("#d-icons").innerHTML = DEBT_ICONS.map((i) => `<button type="button" class="chip ${i === icon ? "on" : ""}" data-i="${i}" aria-label="Ícone ${i}">${i}</button>`).join("");
    };
    drawIcons();
    root.querySelector("#d-icons").onclick = (e) => { const b = e.target.closest("button"); if (b) { icon = b.dataset.i; drawIcons(); } };
    if (!editing) setTimeout(() => root.querySelector("#d-name").focus(), 50);
    root.querySelector("#debtf").onsubmit = (e) => {
      e.preventDefault();
      const val = (id) => root.querySelector(id)?.value.trim() || "";
      const n = parseInt(val("#d-n"), 10) || null;
      const inst = val("#d-inst") ? parseMoney(val("#d-inst")) : null;
      let total = val("#d-total") ? parseMoney(val("#d-total")) : null;
      if (val("#d-inst") && !inst) return toast("Valor da parcela inválido. Ex.: 350,00");
      if (val("#d-total") && !total) return toast("Valor total inválido. Ex.: 4.000,00");
      if (!total && n && inst) total = n * inst;
      if (!total) return toast("Informe o valor total ou as parcelas (nº e valor).");
      const day = parseInt(val("#d-day"), 10) || null;
      if (day && (day < 1 || day > 31)) return toast("O dia do vencimento vai de 1 a 31.");
      const paidBefore = val("#d-paid") ? parseMoney(val("#d-paid")) : null;
      if (val("#d-paid") && !paidBefore) return toast("Valor já pago inválido.");
      const out = {
        ...(dv || { id: uid(), created: Date.now(), payments: [], adjust: [] }),
        name: val("#d-name"), creditor: val("#d-cred"), icon, total, installments: n, installment: inst,
        dueDay: day, remind: root.querySelector("#d-rem").checked, note: val("#d-note"),
      };
      if (paidBefore) out.payments.push({ id: uid(), date: ymd(now()), cents: Math.min(paidBefore, total), note: "pago antes de usar o app", initial: true });
      sheet.close();
      saveDebt(out);

        <span class="main"><span class="title">${h.type === "pay" ? "Pagamento" : h.cents > 0 ? "Juros / multa" : "Desconto"}</span>
          <span class="sub">${fmtDay(h.date)}${h.note ? " · " + esc(h.note) : ""}${h.txId ? " · no extrato" : ""}</span></span>
        <span class="amt money ${h.type === "pay" ? "inc" : ""}">${h.type === "pay" ? "−" : h.cents > 0 ? "+" : "−"} ${brl(Math.abs(h.cents))}</span>
        <button class="icon-btn" style="width:36px;height:36px" data-del-h="${h.type}|${h.id}" aria-label="Apagar">×</button>
      </div>`).join("")}</div>` : `<p class="empty">Nenhum pagamento ainda.</p>`}
    <button class="btn danger" id="dd-del">Apagar dívida</button>`, (root) => {
    root.querySelector("#dd-pay")?.addEventListener("click", () => openDebtPaySheet(dv));
    root.querySelector("#dd-edit").onclick = () => openDebtSheet(dv);
    root.querySelector("#dd-adj").onclick = () => openAdjustSheet(dv);
    root.querySelector("#dd-del").onclick = () => { sheet.close(); deleteDebt(dv.id); };
    root.onclick = (e) => {
      const b = e.target.closest("[data-del-h]");
      if (!b) return;
      const [type, id] = b.dataset.delH.split("|");
      if (type === "pay") deletePayment(dv.id, id);
      else { dv.adjust = dv.adjust.filter((a) => a.id !== id); saveDebt(dv); toast("Ajuste apagado."); }
      openDebtDetail(db.debts.find((x) => x.id === dv.id));
    };
  });
}

function debtHomeCard() {
  const active = debtsActive();
  if (!active.length) return "";
  const T = debtTotals();
  const nextOne = [...active].filter((dv) => debtCalc(dv).nextDue).sort((a, b) => debtCalc(a).nextDue - debtCalc(b).nextDue)[0];
  return `<section class="card debt-mini" data-go="dividas" role="button" tabindex="0">
    <div class="card-head"><h2>Dívidas</h2><span class="link">Abrir</span></div>
    <div class="debt-mid"><div><span class="k">Falta pagar</span><span class="v money">${brl(T.remaining)}</span></div>
      <div class="r"><span class="k">${T.pct}% pago</span><span class="v2">${active.length} ativa${active.length > 1 ? "s" : ""}${T.late ? ` · <b class="due">${T.late} atrasada${T.late > 1 ? "s" : ""}</b>` : ""}</span></div></div>
    <span class="track debt-track"><span class="fill debt-fill" style="width:${T.pct}%"></span></span>
    ${nextOne ? `<span class="small muted">Próximo: ${esc(nextOne.name)} em ${ddmm(debtCalc(nextOne).nextDue)}</span>` : ""}
  </section>`;
}

// ================= formulários =================
const sheet = $("#sheet");
sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
function openSheet(html, bind) {
  $("#sheet-body").innerHTML = html;
  if (!sheet.open) sheet.showModal();
  bind?.($("#sheet-body"));
  $$("[data-close]", sheet).forEach((b) => (b.onclick = () => sheet.close()));
}
const closeBtn = `<button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;

function openTxSheet(t = {}, { fromQuick } = {}) {
  const editing = !!t.id;
  const st = { kind: t.kind || "despesa", category: t.category || null, pay: t.pay || "" };
  const draw = (root) => {
    const cats = db.cats[st.kind];
    if (!cats.some((c) => c.name === st.category)) st.category = null;
    root.querySelector("#cats").innerHTML = cats.map((c) => `<button type="button" class="chip ${st.category === c.name ? "on" : ""}" data-c="${esc(c.name)}">${c.icon} ${esc(c.name)}</button>`).join("");
    root.querySelector("#pays").innerHTML = ["", ...PAYS].map((p) => `<button type="button" class="chip ${st.pay === p ? "on" : ""}" data-p="${p}">${p || "—"}</button>`).join("");
    $$(".seg button", root).forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === st.kind));
  };
  openSheet(`
    <div class="sheet-head"><h2>${editing ? "Editar lançamento" : "Novo lançamento"}</h2>${closeBtn}</div>
    <form id="txf" class="sheet-form" style="display:grid;gap:14px">
      <div class="seg" role="group" aria-label="Tipo"><button type="button" data-k="despesa">Despesa</button><button type="button" data-k="receita">Receita</button></div>
      <label class="field"><span>Valor (R$)</span><input id="f-val" class="big money" inputmode="decimal" placeholder="0,00" required value="${t.cents ? (t.cents / 100).toFixed(2).replace(".", ",") : ""}"></label>
      <div class="field"><span>Categoria</span><div class="cat-grid" id="cats"></div></div>
      <label class="field"><span>Descrição</span><input id="f-desc" placeholder="ex.: ifood, aluguel, uber" value="${esc(t.desc || "")}"></label>
      <div class="two">
        <label class="field"><span>Data</span><input id="f-date" type="date" required value="${t.date || ymd(now())}"></label>
        <div class="field"><span>Pagamento</span><div class="chips" id="pays"></div></div>
      </div>
      <div class="actions"><button class="btn primary">Salvar</button>${editing ? `<button type="button" class="btn danger" id="f-del">Apagar</button>` : ""}</div>
    </form>`, (root) => {
    draw(root);
    root.querySelector(".seg").onclick = (e) => { const b = e.target.closest("button"); if (b) { st.kind = b.dataset.k; draw(root); } };
    root.querySelector("#cats").onclick = (e) => { const b = e.target.closest("button"); if (b) { st.category = b.dataset.c; draw(root); } };
    root.querySelector("#pays").onclick = (e) => { const b = e.target.closest("button"); if (b) { st.pay = b.dataset.p; draw(root); } };
    if (!t.cents) setTimeout(() => root.querySelector("#f-val").focus(), 50);
    root.querySelector("#f-del")?.addEventListener("click", () => { sheet.close(); deleteTx(t.id); });
    root.querySelector("#txf").onsubmit = (e) => {
      e.preventDefault();
      const cents = parseMoney(root.querySelector("#f-val").value);
      if (!cents) { toast("Digite um valor. Ex.: 45,90"); root.querySelector("#f-val").focus(); return; }
      const date = root.querySelector("#f-date").value || ymd(now());
      saveTx({ ...t, kind: st.kind, cents, category: st.category || "outros", desc: root.querySelector("#f-desc").value.trim(), date, pay: st.pay });
      sheet.close();
      if (fromQuick) clearQuick();
      if (!document.querySelector(".toast")) toast(editing ? "Lançamento atualizado." : `✅ ${st.kind === "receita" ? "Receita" : "Despesa"} de ${brl(cents)} salva.`);
    };
  });
}

function openRemSheet(r = {}, { fromQuick } = {}) {
  const editing = !!r.id;
  const start = r.next && editing ? r.next : r.start || fmtLocal(new Date(new Date().setHours(new Date().getHours() + 1, 0, 0, 0)));
  openSheet(`
    <div class="sheet-head"><h2>${editing ? "Lembrete" : "Novo lembrete"}</h2>${closeBtn}</div>
    <form id="remf" style="display:grid;gap:14px">
      <label class="field"><span>Lembrar de</span><input id="r-text" required placeholder="ex.: pagar a conta de luz" value="${esc(r.text || "")}"></label>
      <div class="two">
        <label class="field"><span>Quando</span><input id="r-when" type="datetime-local" required value="${start}"></label>
        <label class="field"><span>Repetir</span><select id="r-rec">${Object.entries(RECURRENCES).map(([k, v]) => `<option value="${k}" ${k === (r.rec || "nenhuma") ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      </div>
      <label class="field"><span>Valor da conta (opcional)</span><input id="r-val" inputmode="decimal" placeholder="Ao marcar como feito, registra o pagamento" value="${r.cents ? (r.cents / 100).toFixed(2).replace(".", ",") : ""}"></label>
      <div class="actions">
        <button class="btn primary">Salvar</button>
        ${editing ? `<button type="button" class="btn" id="r-cal">📅 Pôr na agenda</button><button type="button" class="btn danger" id="r-del">Apagar</button>` : ""}
      </div>
      ${editing && !r.done && isDue(r) ? `<div class="actions"><button type="button" class="btn" id="r-sn1">Adiar 1h</button><button type="button" class="btn" id="r-sn2">Amanhã</button></div>` : ""}
    </form>`, (root) => {
    if (!r.text) setTimeout(() => root.querySelector("#r-text").focus(), 50);
    root.querySelector("#r-del")?.addEventListener("click", () => { sheet.close(); deleteRem(r.id); });
    root.querySelector("#r-cal")?.addEventListener("click", () => addToCalendar(r));
    root.querySelector("#r-sn1")?.addEventListener("click", () => { sheet.close(); snoozeRem(r.id, 60); });
    root.querySelector("#r-sn2")?.addEventListener("click", () => {
      sheet.close();
      const t = addDays(new Date(), 1); const e = parseLocal(r.next);
      const target = new Date(t.getFullYear(), t.getMonth(), t.getDate(), e.getHours(), e.getMinutes());
      snoozeRem(r.id, Math.round((target - now()) / 60e3));
    });
    root.querySelector("#remf").onsubmit = (e) => {
      e.preventDefault();
      const when = root.querySelector("#r-when").value;
      const rec = root.querySelector("#r-rec").value;
      const valRaw = root.querySelector("#r-val").value.trim();
      const cents = valRaw ? parseMoney(valRaw) : null;
      if (valRaw && !cents) { toast("Valor inválido. Ex.: 180,00"); return; }
      if (rec === "nenhuma" && parseLocal(when) < new Date(now().getTime() - 60e3)) { toast("Esse horário já passou. Escolha um horário futuro."); return; }
      const rr = { ...r, text: root.querySelector("#r-text").value.trim(), start: when, rec, cents };
      saveRem(rr);
      sheet.close();
      if (fromQuick) clearQuick();
      const saved = db.rem.find((x) => x.text === rr.text && x.start === when) || rr;
      toast(`⏰ ${editing ? "Lembrete atualizado" : "Lembrete criado"}: ${fmtWhen(saved.next)}.`, { action: "📅 Agenda", onAction: () => addToCalendar(saved), ms: 6000 });
    };
  });
}

function openPaySheet(r, undo) {
  openSheet(`
    <div class="sheet-head"><h2>✅ ${esc(r.text)}</h2>${closeBtn}</div>
    <p>Registrar o pagamento de <b>${brl(r.cents)}</b> como despesa hoje?</p>
    <div class="actions"><button class="btn primary" id="pay-yes">Registrar ${brl(r.cents)}</button><button class="btn" id="pay-no">Só concluir</button></div>
    <button class="link" id="pay-undo">Desfazer “feito”</button>`, (root) => {
    root.querySelector("#pay-yes").onclick = () => {
      const category = db.cats.despesa.some((c) => c.name === "contas") ? "contas" : "outros";
      saveTx({ kind: "despesa", cents: r.cents, category, desc: r.text, date: ymd(now()), pay: "" });
      sheet.close();
      toast(`✅ Pagamento de ${brl(r.cents)} registrado.`, { action: "Desfazer", onAction: () => deleteLast(1) });
    };
    root.querySelector("#pay-no").onclick = () => sheet.close();
    root.querySelector("#pay-undo").onclick = () => { sheet.close(); undo(); };
  });
}

function openCategorySheet(kind) {
  openSheet(`
    <div class="sheet-head"><h2>Nova categoria de ${kind}</h2>${closeBtn}</div>
    <form id="catf" style="display:grid;gap:14px">
      <div class="two" style="grid-template-columns: 90px minmax(0,1fr)">
        <label class="field"><span>Ícone</span><input id="c-icon" maxlength="4" value="🏷️" style="text-align:center;font-size:22px"></label>
        <label class="field"><span>Nome</span><input id="c-name" required placeholder="ex.: academia"></label>
      </div>
      <button class="btn primary">Adicionar</button>
    </form>`, (root) => {
    setTimeout(() => root.querySelector("#c-name").focus(), 50);
    root.querySelector("#catf").onsubmit = (e) => {
      e.preventDefault();
      const name = root.querySelector("#c-name").value.trim().toLowerCase().replace(/\s+/g, " ");
      if (!name) return;
      if (db.cats[kind].some((c) => c.name === name)) { toast("Essa categoria já existe."); return; }
      const list = db.cats[kind];
      list.splice(Math.max(list.length - 1, 0), 0, { name, icon: root.querySelector("#c-icon").value.trim() || "🏷️" });
      sheet.close();
      commit();
      toast(`Categoria “${name}” criada.`);
    };
  });
}
function removeCategory(kind, name) {
  const used = db.tx.filter((t) => t.kind === kind && t.category === name).length;
  openSheet(`
    <div class="sheet-head"><h2>Remover “${esc(name)}”?</h2>${closeBtn}</div>
    <p>${used ? `${used} lançamento(s) dessa categoria vão para “outros”.` : "Nenhum lançamento usa essa categoria."}</p>
    <div class="actions"><button class="btn danger" id="cat-yes">Remover</button><button class="btn" data-close>Cancelar</button></div>`, (root) => {
    root.querySelector("#cat-yes").onclick = () => {
      db.cats[kind] = db.cats[kind].filter((c) => c.name !== name);
      for (const t of db.tx) if (t.kind === kind && t.category === name) t.category = "outros";
      delete db.budgets[name];
      sheet.close();
      commit();
    };
  });
}

function openWipeSheet() {
  openSheet(`
    <div class="sheet-head"><h2>Apagar todos os dados?</h2>${closeBtn}</div>
    <p>Isso não dá para desfazer. Se quiser guardar, salve um backup antes.</p>
    <label class="field"><span>Digite APAGAR para confirmar</span><input id="w-in" autocomplete="off"></label>
    <div class="actions"><button class="btn danger" id="w-yes" disabled>Apagar tudo</button><button class="btn" data-close>Cancelar</button></div>`, (root) => {
    const inp = root.querySelector("#w-in"), yes = root.querySelector("#w-yes");
    inp.oninput = () => (yes.disabled = inp.value.trim().toUpperCase() !== "APAGAR");
    yes.onclick = () => { db = emptyDb(); sheet.close(); commit(); toast("Todos os dados foram apagados."); };
  });
}

// ================= backup =================
async function exportBackup() {
  db.meta.lastBackup = Date.now();
  persist();
  const name = `minhas-contas-${ymd(now())}.json`;
  const json = JSON.stringify({ app: "minhas-contas", exported: new Date().toISOString(), data: db }, null, 1);
  const file = typeof File === "function" ? new File([json], name, { type: "application/json" }) : null;
  if (file && navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Backup Minhas Contas" }); render(); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  download(name, json, "application/json");
  render();
}
$("#import-file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  let incoming;
  try {
    const parsed = JSON.parse(await f.text());
    incoming = migrate(parsed.data || parsed);
    if (!Array.isArray(incoming.tx) || !Array.isArray(incoming.rem)) throw new Error();
  } catch { toast("Esse arquivo não é um backup válido do Minhas Contas."); return; }
  openSheet(`
    <div class="sheet-head"><h2>Restaurar backup?</h2>${closeBtn}</div>
    <p>O arquivo tem <b>${incoming.tx.length}</b> lançamentos e <b>${incoming.rem.length}</b> lembretes. Os dados atuais deste aparelho (${db.tx.length} lançamentos) serão <b>substituídos</b>.</p>
    <div class="actions"><button class="btn primary" id="imp-yes">Substituir pelos do backup</button><button class="btn" data-close>Cancelar</button></div>`, (root) => {
    root.querySelector("#imp-yes").onclick = () => { db = incoming; sheet.close(); commit(); toast("✅ Backup restaurado."); };
  });
});
function restoreSnapshot(key) {
  const snap = migrate(JSON.parse(localStorage.getItem(key)));
  openSheet(`
    <div class="sheet-head"><h2>Voltar para a cópia de ${fmtDay(key.slice(SNAP_PREFIX.length))}?</h2>${closeBtn}</div>
    <p>A cópia tem ${snap.tx.length} lançamentos e ${snap.rem.length} lembretes (agora: ${db.tx.length} e ${db.rem.length}).</p>
    <div class="actions"><button class="btn primary" id="snap-yes">Voltar para esta cópia</button><button class="btn" data-close>Cancelar</button></div>`, (root) => {
    root.querySelector("#snap-yes").onclick = () => { db = snap; sheet.close(); commit(); toast("Dados restaurados."); };
  });
}
function exportCSV() {
  const rows = [["data", "tipo", "valor", "categoria", "descricao", "pagamento"]];
  for (const t of [...db.tx].sort((a, b) => a.date.localeCompare(b.date))) {
    rows.push([t.date, t.kind, (t.cents / 100).toFixed(2).replace(".", ","), t.category, t.desc, t.pay]);
  }
  const csv = "﻿" + rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
  download(`minhas-contas-${ymd(now())}.csv`, csv, "text/csv");
}

// ================= avisos dos lembretes =================
async function askNotifications() {
  if (!("Notification" in window)) { toast("Este navegador não mostra avisos. Use “Pôr na agenda”."); return; }
  const p = await Notification.requestPermission();
  toast(p === "granted" ? "🔔 Avisos ativados enquanto o app estiver aberto." : "Avisos não permitidos. Use “Pôr na agenda”.", { ms: 5000 });
  render();
}
async function notify(r) {
  const body = [r.cents ? brl(r.cents) : "", r.rec !== "nenhuma" ? RECURRENCES[r.rec] : ""].filter(Boolean).join(" · ") || "Toque para abrir";
  if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.([200, 100, 200]);
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      const reg = await navigator.serviceWorker?.getRegistration();
      if (reg) { await reg.showNotification(`⏰ ${r.text}`, { body, tag: r.id, renotify: true, icon: "icon-192.png", badge: "icon-192.png", data: { id: r.id } }); return; }
      new Notification(`⏰ ${r.text}`, { body, tag: r.id });
      return;
    } catch {}
  }
  toast(`⏰ ${r.text}`, { action: "Feito", onAction: () => completeRem(r.id), ms: 10000 });
}
function checkDue() {
  let changed = false;
  for (const r of dueReminders()) {
    const e = effWhen(r);
    if (r.notifiedFor === e) continue;
    r.notifiedFor = e;
    changed = true;
    notify(r);
  }
  if (changed) { persist(); render(); }
  else if (ui.tab === "inicio" || ui.tab === "lembretes") {
    // atualiza "hoje/amanhã" e lembretes vencendo sem precisar recarregar
    const sig = dueReminders().length + "|" + ymd(now());
    if (sig !== checkDue.sig) { checkDue.sig = sig; if (!sheet.open && document.activeElement?.id !== "q" && document.activeElement?.id !== "search") render(); }
  }
}
setInterval(checkDue, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkDue(); render(); } });

// ================= avisos na tela =================
function toast(msg, { action, onAction, ms = 3500 } = {}) {
  const wrap = $("#toasts");
  wrap.innerHTML = "";
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action)}</button>` : ""}`;
  if (action) el.querySelector("button").onclick = () => { el.remove(); onAction?.(); };
  wrap.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ================= atualizações do app =================
let swReg = null;
function showUpdateBanner() {
  $("#banner").innerHTML = `<div class="app" style="padding-block:8px 0"><div class="alert info" style="justify-content:space-between;align-items:center">
    <span>✨ Nova versão do app pronta. Seus dados continuam aqui.</span><button class="btn primary" id="reload">Atualizar</button></div></div>`;
  $("#reload").onclick = () => location.reload();
}
async function checkUpdate(manual) {
  if (!swReg) { if (manual) toast(location.protocol === "file:" ? "Aberto como arquivo: substitua o arquivo para atualizar." : "Atualização automática indisponível neste navegador."); return; }
  try {
    await swReg.update();
    const res = await fetch("./index.html?check=" + Date.now(), { cache: "no-store" });
    if (manual) setTimeout(() => { if (!$("#reload")) toast(res.ok ? `Você já está na versão mais recente (${APP_VERSION}).` : "Sem internet para procurar atualização."); }, 2500);
  } catch { if (manual) toast("Sem internet para procurar atualização."); }
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("sw.js").then((reg) => { swReg = reg; }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", (e) => { if (e.data?.type === "app-updated") showUpdateBanner(); });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (window.__swReady) showUpdateBanner(); window.__swReady = true; });
  if (navigator.serviceWorker.controller) window.__swReady = true;
}

render();
checkDue();
</script>
