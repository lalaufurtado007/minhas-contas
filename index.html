<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Contas</title>
<meta name="description" content="Gastos, receitas, orçamentos e lembretes. Funciona sem internet e guarda tudo no seu celular.">
<meta name="theme-color" content="#f2f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0f0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: coluna única de celular (máx. 560px). Topo com saudação, cartão de saldo em degradê
   verde-petróleo, cartões arredondados com sombra suave, barra de abas flutuante com o + no centro.
   Formulários em folha que sobe de baixo. */
:root {
  color-scheme: light;
  --bg: #f2f5f4;
  --surface: #ffffff;
  --surface-2: #f0f4f3;
  --ink: #0f1917;
  --muted: #5e6b67;
  --faint: #8b9894;
  --line: #e2e8e6;
  --accent: #0a7c6c;
  --accent-ink: #ffffff;
  --accent-soft: #d7f1ea;
  --accent-wash: rgba(10, 124, 108, .13);
  --ghost: #b3bdba;
  --hero-a: #04332f;
  --hero-b: #0a7c6c;
  --hero-c: #19b39a;
  --debt-a: #6e1230;
  --debt-b: #d2434a;
  --debt-c: #f2845a;
  --mint: #0b8a5e;  --mint-bg: #d8f6e9;
  --sky: #1f62d0;   --sky-bg: #dfeaff;
  --amber: #a35a00; --amber-bg: #ffefcf;
  --rose: #c42452;  --rose-bg: #ffe1ea;
  --mesh-1: rgba(25, 179, 154, .16);
  --mesh-2: rgba(80, 140, 255, .10);
  --income: #15803d;
  --good: #15803d;  --good-bg: #dcf3e3;
  --warn: #935400;  --warn-bg: #fdefd5; --warn-bar: #e6a01e;
  --crit: #c2362f;  --crit-bg: #fbe2e0;
  --shadow: 0 1px 1px rgba(16, 24, 40, .03), 0 2px 6px -1px rgba(16, 24, 40, .05), 0 16px 34px -16px rgba(16, 24, 40, .18);
  --shadow-lg: 0 6px 14px -6px rgba(4, 51, 47, .35), 0 26px 50px -20px rgba(10, 124, 108, .6);
  --shadow-debt: 0 6px 14px -6px rgba(110, 18, 48, .35), 0 26px 50px -20px rgba(210, 67, 74, .55);
  --shadow-fab: 0 10px 22px -6px rgba(10, 124, 108, .65), inset 0 1px 0 rgba(255, 255, 255, .25);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 20px;
  --nav-h: 66px;
  --card-border: transparent;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0a0f0e; --surface: #131a18; --surface-2: #1a2320; --ink: #eef3f1; --muted: #9ba9a5; --faint: #6f7d79; --line: #24302c;
  --accent: #3fd0b8; --accent-ink: #03211c; --accent-soft: #123630; --accent-wash: rgba(63, 208, 184, .15); --ghost: #4c5a56;
  --hero-a: #032a26; --hero-b: #0a6b5d; --hero-c: #13a08a; --income: #5fd17f;
  --debt-a: #4d0c22; --debt-b: #a8323c; --debt-c: #d56a48;
  --mint: #4fe0a8; --mint-bg: #10362a; --sky: #86b5ff; --sky-bg: #16294a; --amber: #f7bf61; --amber-bg: #3a2b10; --rose: #ff8fae; --rose-bg: #401a27;
  --mesh-1: rgba(63, 208, 184, .10); --mesh-2: rgba(80, 140, 255, .07);
  --good: #5fd17f; --good-bg: #16301f; --warn: #f2b34d; --warn-bg: #362812; --warn-bar: #e6a01e;
  --crit: #ff7b72; --crit-bg: #3a1a18; --card-border: #1f2926;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 16px 34px -16px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.035);
  --shadow-lg: 0 6px 14px -6px rgba(0,0,0,.5), 0 26px 50px -20px rgba(19, 160, 138, .45);
  --shadow-debt: 0 6px 14px -6px rgba(0,0,0,.5), 0 26px 50px -20px rgba(168, 50, 60, .45);
  --shadow-fab: 0 10px 22px -6px rgba(19, 160, 138, .55), inset 0 1px 0 rgba(255, 255, 255, .2);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0f0e; --surface: #131a18; --surface-2: #1a2320; --ink: #eef3f1; --muted: #9ba9a5; --faint: #6f7d79; --line: #24302c;
  --accent: #3fd0b8; --accent-ink: #03211c; --accent-soft: #123630; --accent-wash: rgba(63, 208, 184, .15); --ghost: #4c5a56;
  --hero-a: #032a26; --hero-b: #0a6b5d; --hero-c: #13a08a; --income: #5fd17f;
  --debt-a: #4d0c22; --debt-b: #a8323c; --debt-c: #d56a48;
  --mint: #4fe0a8; --mint-bg: #10362a; --sky: #86b5ff; --sky-bg: #16294a; --amber: #f7bf61; --amber-bg: #3a2b10; --rose: #ff8fae; --rose-bg: #401a27;
  --mesh-1: rgba(63, 208, 184, .10); --mesh-2: rgba(80, 140, 255, .07);
  --good: #5fd17f; --good-bg: #16301f; --warn: #f2b34d; --warn-bg: #362812; --warn-bar: #e6a01e;
  --crit: #ff7b72; --crit-bg: #3a1a18; --card-border: #1f2926;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 16px 34px -16px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.035);
  --shadow-lg: 0 6px 14px -6px rgba(0,0,0,.5), 0 26px 50px -20px rgba(19, 160, 138, .45);
  --shadow-debt: 0 6px 14px -6px rgba(0,0,0,.5), 0 26px 50px -20px rgba(168, 50, 60, .45);
  --shadow-fab: 0 10px 22px -6px rgba(19, 160, 138, .55), inset 0 1px 0 rgba(255, 255, 255, .2);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(70% 45% at 0% 0%, var(--mesh-1), transparent 70%), radial-gradient(60% 40% at 100% 0%, var(--mesh-2), transparent 70%); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
p { margin: 0; }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 40px);
  display: grid; gap: 14px; }

h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 24px; font-weight: 800; }
h2 { font-size: 16px; font-weight: 700; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.card { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-head .sub { font-size: 13px; color: var(--muted); }
.link { color: var(--accent); font-size: 14px; font-weight: 700; text-decoration: none; background: none; border: 0; padding: 4px 0; cursor: pointer; }

/* topo */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 2px; }
.top h1 { text-transform: capitalize; }
.top .hello { font-size: 14px; color: var(--muted); font-weight: 600; }

/* cartão de saldo */
.hero { position: relative; overflow: hidden; color: #fff; border-radius: 24px; padding: 18px 18px 16px; display: grid; gap: 10px;
  background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 45%), linear-gradient(140deg, var(--hero-a) 0%, var(--hero-b) 58%, var(--hero-c) 100%);
  box-shadow: var(--shadow-lg); }
.hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 180px; height: 180px; border-radius: 50%; border: 26px solid rgba(255,255,255,.06); pointer-events: none; }
.hero .eyebrow { color: rgba(255,255,255,.78); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero .big { font-size: clamp(34px, 10vw, 44px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.hero-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hero-split > div { background: rgba(255,255,255,.1); border-radius: 14px; padding: 9px 12px; display: grid; gap: 1px; min-width: 0; }
.hero-split .k { font-size: 12px; color: rgba(255,255,255,.75); display: flex; align-items: center; gap: 5px; }
.hero-split .v { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-meter { display: grid; gap: 6px; font-size: 12.5px; color: rgba(255,255,255,.8); }
.hero-meter .track { background: rgba(255,255,255,.18); border: 0; height: 8px; }
.hero-meter .fill { background: #fff; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; white-space: nowrap; }

/* entrada rápida */
.quick { padding: 10px; gap: 8px; }
.quick form { display: flex; gap: 8px; align-items: center; min-width: 0; }
.quick input { flex: 1 1 0; width: 0; min-width: 0; border: 0; background: var(--surface-2); border-radius: 14px; padding: 13px 14px; font-size: 16px; }
.quick input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.quick .small { padding: 0 6px 4px; }
.icon-btn { flex: none; width: 46px; height: 46px; border-radius: 14px; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn.primary { background: linear-gradient(140deg, var(--hero-c), var(--hero-b)); color: #fff; box-shadow: 0 6px 14px -6px rgba(10, 124, 108, .6); }
.icon-btn.ghost { background: var(--surface); box-shadow: var(--shadow); }
.icon-btn.listening { background: var(--crit); color: #fff; }
.icon-btn svg { width: 22px; height: 22px; }
.preview { display: grid; gap: 8px; padding: 0 4px 4px; }
.preview:empty { display: none; }
.preview-item { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 10px; background: var(--surface-2); font-size: 13px; white-space: nowrap; }
.pill.strong { background: var(--accent-soft); font-weight: 700; }
.pill.inc { color: var(--income); }
.preview-actions { display: flex; gap: 8px; }

.btn { border: 0; background: var(--surface-2); border-radius: 14px; padding: 11px 16px; font-weight: 700; cursor: pointer; min-height: 44px; color: var(--ink); }
.btn.primary { background: linear-gradient(140deg, var(--hero-c), var(--hero-b)); color: #fff; box-shadow: 0 6px 14px -6px rgba(10, 124, 108, .55); }
.btn.sm { min-height: 36px; padding: 7px 16px; font-size: 14px; }
.btn.danger { color: var(--crit); background: var(--crit-bg); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* números do mês */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--card-border); border-radius: 18px; padding: 13px 14px; display: grid; gap: 2px; min-width: 0; box-shadow: var(--shadow); }
.stat .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; }
.stat .ic svg { width: 17px; height: 17px; }
.ic.mint { background: var(--mint-bg); color: var(--mint); } .ic.sky { background: var(--sky-bg); color: var(--sky); }
.ic.amber { background: var(--amber-bg); color: var(--amber); } .ic.rose { background: var(--rose-bg); color: var(--rose); }
.stat .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.stat .value { font-size: 19px; font-weight: 800; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .hint { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* gráficos */
.chart { position: relative; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis { fill: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .lbl { fill: var(--ink); font-size: 12px; font-weight: 700; }
.chart .hair { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.chart.active .hair { opacity: .6; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); opacity: 0; transition: opacity .12s; min-width: 120px; z-index: 2; }
.chart.active .tip { opacity: 1; }
.tip .t-head { font-weight: 600; opacity: .75; margin-bottom: 3px; }
.tip .t-row { display: flex; align-items: center; gap: 6px; }
.tip .t-row b { font-weight: 800; }
.tip .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .key { width: 14px; height: 2px; border-radius: 1px; }
.seg-mini { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg-mini button { border: 0; background: none; padding: 4px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg-mini button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* listas */
.list { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); min-width: 0; background: none; text-align: left; width: 100%; cursor: pointer; color: var(--ink); }
.list > .row:first-child { border-top: 0; padding-top: 2px; }
.row .ico { flex: none; width: 42px; height: 42px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; }
.row .main { flex: 1; min-width: 0; }
.row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; display: block; }
.row .sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row .amt { font-weight: 750; white-space: nowrap; }
.amt.inc { color: var(--income); }
.day-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 14px 0 2px; font-weight: 700; text-transform: capitalize; }

/* categorias */
.bars { display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 42px minmax(0, 1fr); column-gap: 12px; row-gap: 6px; align-items: center; background: none; border: 0; padding: 7px 0; text-align: left; cursor: pointer; width: 100%; color: var(--ink); }
.bar-row .ico { width: 42px; height: 42px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; grid-row: span 2; }
.bar-line { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; align-items: baseline; }
.bar-line .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
.bar-line .name::first-letter { text-transform: uppercase; }
.bar-line .val { white-space: nowrap; font-weight: 700; }
.bar-line .pct { color: var(--muted); font-weight: 600; font-size: 12.5px; margin-left: 6px; }
.track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.fill { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 3px; }
.fill.good { background: var(--good); } .fill.warn { background: var(--warn-bar); } .fill.crit { background: var(--crit); }
.bar-plain { display: grid; gap: 6px; padding: 6px 0; }
.status { font-size: 11.5px; font-weight: 750; border-radius: 999px; padding: 2px 8px; }
.status.good { color: var(--good); background: var(--good-bg); }
.status.warn { color: var(--warn); background: var(--warn-bg); }
.status.crit { color: var(--crit); background: var(--crit-bg); }

/* extrato */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--card-border); border-radius: 16px; padding: 11px 10px; min-width: 0; box-shadow: var(--shadow); }
.tile .label { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .value { font-size: clamp(12.5px, 3.45vw, 15.5px); letter-spacing: -.01em; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 360px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav h1 { text-transform: capitalize; font-size: 21px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface-2); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink); }
.chip[aria-pressed="true"], .chip.on { background: var(--accent); color: var(--accent-ink); }
.search { border: 0; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 16px; width: 100%; }

/* lembretes */
.rem-actions { display: flex; gap: 6px; flex: none; }
.rem-actions .btn { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.due { color: var(--crit); font-weight: 700; }
.alert { border-radius: 16px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.crit { background: var(--crit-bg); color: var(--crit); }
.alert.info { background: var(--accent-soft); color: var(--ink); }

/* barra de abas flutuante */
.nav { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 536px; margin: 0 auto;
  background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-lg); }
.nav-inner { display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr; height: var(--nav-h); align-items: center; }
.nav button { background: none; border: 0; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 650; color: var(--faint); cursor: pointer; position: relative; height: 100%; }
.nav button svg { width: 23px; height: 23px; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 6px; width: 34px; height: 3px; border-radius: 2px; background: var(--accent); }
.nav .fab { width: 54px; height: 54px; border-radius: 18px; border: 0; background: linear-gradient(140deg, var(--hero-c), var(--hero-b) 55%, var(--hero-a)); color: #fff; box-shadow: var(--shadow-fab); display: grid; place-items: center; cursor: pointer; margin: 0 auto; transform: translateY(-14px); }
.nav .fab svg { width: 26px; height: 26px; }
.badge { position: absolute; top: 9px; left: calc(50% + 5px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }

/* folha (formulários) */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; border-radius: 26px 26px 0 0; background: var(--surface); color: var(--ink); }
dialog.sheet::backdrop { background: rgba(5, 12, 11, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet-body { padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; overflow-y: auto; max-height: 92vh; }
.sheet-body::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field select, .field textarea { border: 0; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 16px; width: 100%; min-width: 0; }
.field input.big { font-size: 32px; font-weight: 800; padding: 10px 14px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 11px; padding: 9px 6px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.cat-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn.primary { flex: 1; }

/* avisos */
.toast-wrap { position: fixed; left: 0; right: 0; z-index: 30; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 30px); display: grid; justify-items: center; padding-inline: 16px; pointer-events: none; }
.toast { pointer-events: auto; max-width: 528px; width: 100%; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; box-shadow: var(--shadow-lg); font-size: 14px; }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; padding: 4px; white-space: nowrap; }
.banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 12; }

.empty { color: var(--muted); font-size: 14px; padding: 4px 0; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.setting:first-of-type { border-top: 0; }
.setting .money-in { width: 120px; text-align: right; border: 0; background: var(--surface-2); border-radius: 12px; padding: 9px 12px; font-size: 16px; }


/* topo com ações */
.top-actions { display: flex; gap: 8px; }

/* dívidas */
.debt-hero { background: radial-gradient(120% 140% at 100% 0%, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 45%), linear-gradient(140deg, var(--debt-a) 0%, var(--debt-b) 60%, var(--debt-c) 100%); box-shadow: var(--shadow-debt); }
.debts { display: grid; gap: 12px; }
.debt { background: var(--surface); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); cursor: pointer; position: relative; overflow: hidden; }
.debt::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--debt-c), var(--debt-b)); }
.debt.is-done::before { background: var(--good); }
.debt.is-done { opacity: .85; }
.debt-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.debt-top .ico { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--rose-bg); display: grid; place-items: center; font-size: 21px; }
.debt-top .main { flex: 1; min-width: 0; }
.debt-top .title { display: block; font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.debt-top .sub { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.debt-mid { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.debt-mid > div { display: grid; min-width: 0; }
.debt-mid .r { text-align: right; }
.debt-mid .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.debt-mid .v { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.debt-mid .v2 { font-size: 13px; font-weight: 650; color: var(--muted); }
.debt-track { height: 10px; border-radius: 5px; background: var(--rose-bg); }
.debt-fill { background: linear-gradient(90deg, var(--debt-b), var(--debt-c)); border-radius: 5px; }
.is-done .debt-fill { background: var(--good); }
.debt-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.debt-mini { cursor: pointer; }
.debt-sum { display: grid; gap: 6px; background: var(--surface-2); border-radius: 16px; padding: 14px; }
.debt-sum .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.debt-sum .v { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.facts > div { display: grid; gap: 1px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.facts .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.facts .v { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
.empty-state { text-align: center; justify-items: center; padding: 28px 20px; }
.empty-state .big-ico { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; font-size: 34px; background: var(--rose-bg); box-shadow: var(--shadow); }
.empty-state p { max-width: 42ch; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14.5px; font-weight: 600; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
details.card > summary { cursor: pointer; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "▾"; float: right; color: var(--muted); }
details.card[open] > summary::after { content: "▴"; }

/* modo privado: esconde os valores */
.privado .money { filter: blur(7px); }
.privado .chart .axis.money, .privado .chart .lbl.money { visibility: hidden; }

@media (prefers-reduced-motion: no-preference) {
  .view-enter > * { animation: rise .32s cubic-bezier(.2, .7, .2, 1) both; }
  .view-enter > *:nth-child(2) { animation-delay: .03s; } .view-enter > *:nth-child(3) { animation-delay: .06s; }
  .view-enter > *:nth-child(4) { animation-delay: .09s; } .view-enter > *:nth-child(5) { animation-delay: .12s; }
  .view-enter > *:nth-child(n+6) { animation-delay: .15s; }
  dialog.sheet[open] { animation: up .24s cubic-bezier(.2, .7, .2, 1); }
  .toast { animation: up .18s ease-out; }
  .fill { transition: width .5s cubic-bezier(.2, .7, .2, 1); }
}
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
@keyframes up { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }
</style>

<script>
/* Núcleo do app (sem tela): dinheiro, datas, recorrência, leitura de frases e agenda (.ics).
   Este arquivo é copiado para dentro do index.html pelo build.py. Testes: node test/core.test.js */

const Core = (() => {
  // ---------- dinheiro ----------
  function parseMoney(str) {
    if (str == null) return null;
    let s = String(str).replace(/r\$\s*/i, "").replace(/\s/g, "");
    if (!s) return null;
    if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d+,\d{1,2}$/.test(s)) s = s.replace(",", ".");
    else if (/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(s)) s = s.replace(/,/g, "");
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    const cents = Math.round(parseFloat(s) * 100);
    return cents > 0 ? cents : null;
  }

  function brl(cents, opts = {}) {
    const neg = cents < 0;
    const abs = Math.abs(Math.round(cents));
    const int = Math.floor(abs / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const frac = String(abs % 100).padStart(2, "0");
    const sign = neg ? "−" : opts.plus && cents > 0 ? "+" : "";
    return `${sign}R$ ${int},${frac}`;
  }

  // ---------- datas (sempre horário local do aparelho) ----------
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const fmtLocal = (d) => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

  function parseDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function parseLocal(s) {
    const [d, t = "09:00"] = s.split("T");
    const [y, m, dd] = d.split("-").map(Number);
    const [hh, mi] = t.split(":").map(Number);
    return new Date(y, m - 1, dd, hh, mi, 0, 0);
  }
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, d.getHours(), d.getMinutes());
  const dayNumber = (d) => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
  const isWeekend = (d) => d.getDay() === 0 || d.getDay() === 6;
  const lastDayOfMonth = (y, m) => new Date(y, m + 1, 0).getDate();

  function addMonths(start, k) {
    const total = start.getMonth() + k;
    const y = start.getFullYear() + Math.floor(total / 12);
    const m = ((total % 12) + 12) % 12;
    const day = Math.min(start.getDate(), lastDayOfMonth(y, m));
    return new Date(y, m, day, start.getHours(), start.getMinutes());
  }

  const RECURRENCES = {
    nenhuma: "Não repete",
    diaria: "Todo dia",
    dias_uteis: "Dias úteis",
    semanal: "Toda semana",
    mensal: "Todo mês",
    anual: "Todo ano",
  };

  /** Primeira ocorrência estritamente depois de `after`. Sempre calculada a partir do início,
      então um lembrete mensal no dia 31 cai em 30/04, 28/02... e volta ao 31 quando dá. */
  function nextOccurrence(start, rec, after) {
    if (start > after) {
      if (rec === "dias_uteis" && isWeekend(start)) return nextOccurrence(start, rec, start);
      return start;
    }
    if (rec === "nenhuma") return null;
    if (rec === "diaria" || rec === "dias_uteis") {
      let c = new Date(after.getFullYear(), after.getMonth(), after.getDate(), start.getHours(), start.getMinutes());
      while (c <= after || (rec === "dias_uteis" && isWeekend(c))) c = addDays(c, 1);
      return c;
    }
    if (rec === "semanal") {
      let c = addDays(start, Math.floor((dayNumber(after) - dayNumber(start)) / 7) * 7);
      while (c <= after) c = addDays(c, 7);
      return c;
    }
    if (rec === "mensal" || rec === "anual") {
      const step = rec === "mensal" ? 1 : 12;
      const months = (after.getFullYear() - start.getFullYear()) * 12 + after.getMonth() - start.getMonth();
      let k = Math.max(Math.floor(months / step) * step - step, 0);
      for (;;) {
        const c = addMonths(start, k);
        if (c > after) return c;
        k += step;
      }
    }
    throw new Error("Recorrência inválida: " + rec);
  }

  // ---------- leitura de frases ----------
  // "dobra" acentos sem mudar o tamanho do texto, para apagar trechos no original
  const fold = (s) => s.split("").map((c) => c.normalize("NFD")[0]).join("").toLowerCase();

  const WEEKDAYS = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"];
  const WEEKDAY_RE = "(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira| feira)?";

  const KEYWORDS = {
    mercado: ["mercado", "supermercado", "feira", "atacadao", "atacado", "hortifruti", "sacolao", "assai", "carrefour"],
    "alimentação": ["ifood", "restaurante", "lanche", "almoco", "almocei", "jantar", "jantei", "pizza", "padaria", "cafe", "hamburguer", "acai", "marmita", "delivery", "sorvete", "comida"],
    transporte: ["uber", "99", "taxi", "onibus", "metro", "gasolina", "combustivel", "posto", "estacionamento", "pedagio", "passagem", "etanol", "alcool", "oficina", "mecanico"],
    moradia: ["aluguel", "condominio", "iptu", "reforma", "diarista"],
    contas: ["luz", "energia", "agua", "internet", "telefone", "celular", "gas", "conta", "fatura", "boleto"],
    "saúde": ["farmacia", "remedio", "medico", "dentista", "consulta", "exame", "plano de saude", "academia", "terapia"],
    lazer: ["cinema", "show", "bar", "viagem", "passeio", "ingresso", "jogo", "festa", "cerveja"],
    assinaturas: ["netflix", "spotify", "assinatura", "streaming", "prime", "disney", "hbo", "youtube", "icloud", "globoplay"],
    compras: ["roupa", "loja", "shopee", "amazon", "mercado livre", "shein", "sapato", "presente", "magalu"],
    "educação": ["curso", "escola", "faculdade", "livro", "material", "mensalidade"],
    pets: ["pet", "racao", "veterinario", "petshop", "banho e tosa"],
    "salário": ["salario", "pagamento da empresa", "holerite"],
    freelance: ["freela", "freelance", "servico", "projeto", "bico"],
    vendas: ["vendi", "venda"],
    investimentos: ["rendimento", "dividendo", "investimento", "juros", "cdb", "tesouro"],
  };
  const INCOME_RE = /\b(recebi|ganhei|caiu|entrou|vendi|recebido|recebimento|reembolso|salario|rendimento|dividendo|renda|freela)\b/;
  const FILLER = new Set(
    "gastei paguei comprei recebi ganhei vendi caiu entrou por pelo pela via foi deu de do da dos das no na nos nas em com pro pra para o a os as um uma uns umas r$ reais real conto contos pila mais e que hoje ontem anteontem".split(" ")
  );
  const PAYMENTS = [
    ["pix", /\b(no |via |pelo |por )?pix\b/],
    ["crédito", /\b(no |via |pelo |por )?(cartao de credito|credito|cartao)\b/],
    ["débito", /\b(no |via |pelo |por )?(cartao de debito|debito)\b/],
    ["dinheiro", /\b(em |no )?(dinheiro|especie)\b/],
    ["boleto", /\b(no |via |pelo |por )?boleto\b/],
  ];
  const AMOUNT_RE =
    /(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(\s*mil\b)?(?:\s*(?:reais|real|conto|contos|pila|r\$))?/g;

  function blank(orig, folded, re) {
    // apaga (com espaços) todos os trechos de `re` em orig/folded; retorna os matches
    const found = [];
    let o = orig, f = folded;
    f.replace(re, (...args) => {
      const m = args[0], idx = args[args.length - 2];
      found.push({ m, idx, groups: args.slice(1, -2) });
      return m;
    });
    for (const { m, idx } of found) {
      o = o.slice(0, idx) + " ".repeat(m.length) + o.slice(idx + m.length);
      f = f.slice(0, idx) + " ".repeat(m.length) + f.slice(idx + m.length);
    }
    return { orig: o, folded: f, found };
  }

  function cleanText(s) {
    return s.replace(/[,;:.!?]+(\s|$)/g, " ").replace(/\s+/g, " ").trim();
  }

  function parseWhenDay(folded, now) {
    // retorna {date, re} da primeira data encontrada (sem hora)
    const rules = [
      [/\bdepois de amanha\b/, () => addDays(now, 2)],
      [/\bamanha\b/, () => addDays(now, 1)],
      [/\banteontem\b/, () => addDays(now, -2)],
      [/\bontem\b/, () => addDays(now, -1)],
      [/\bhoje\b/, () => now],
    ];
    for (const [re, fn] of rules) if (re.test(folded)) return { date: fn(), re };
    let m = folded.match(/\b(?:dia )?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    if (m) {
      let y = m[3] ? Number(m[3].length === 2 ? "20" + m[3] : m[3]) : now.getFullYear();
      return { date: new Date(y, Number(m[2]) - 1, Number(m[1])), re: new RegExp(m[0].replace(/\//g, "\\/")), explicitYear: !!m[3], dm: true };
    }
    m = folded.match(/\bdia (\d{1,2})\b/);
    if (m) return { dayOfMonth: Number(m[1]), re: /\bdia \d{1,2}\b/ };
    m = folded.match(new RegExp("\\b(?:na |no |nesta |nessa |proxima |proximo )?" + WEEKDAY_RE + "\\b"));
    if (m) return { weekday: WEEKDAYS.indexOf(m[1]), re: new RegExp(m[0]) };
    return null;
  }

  function guessCategory(folded, kind, cats, learned) {
    const names = (cats[kind] || []).map((c) => c.name);
    for (const n of names) if (n !== "outros" && new RegExp("\\b" + fold(n) + "\\b").test(folded)) return n;
    for (const w of folded.split(/\s+/)) if (learned[w] && names.includes(learned[w])) return learned[w];
    for (const [cat, words] of Object.entries(KEYWORDS)) {
      if (!names.includes(cat)) continue;
      if (words.some((w) => new RegExp("\\b" + w + "\\b").test(folded))) return cat;
    }
    return "outros";
  }

  function describe(orig) {
    const words = cleanText(orig).split(" ").filter((w) => w && !FILLER.has(fold(w)));
    return words.join(" ");
  }

  function parseTransactions(text, now, ctx) {
    const orig0 = text, folded0 = fold(text);
    const kind = INCOME_RE.test(folded0) ? "receita" : "despesa";

    // data
    let date = now, o = orig0, f = folded0;
    const when = parseWhenDay(f, now);
    if (when) {
      if (when.date) date = when.date;
      else if (when.dayOfMonth) {
        date = new Date(now.getFullYear(), now.getMonth(), when.dayOfMonth);
        if (date > now) date = new Date(now.getFullYear(), now.getMonth() - 1, when.dayOfMonth);
      } else if (when.weekday != null) {
        const back = (now.getDay() - when.weekday + 7) % 7 || 7;
        date = addDays(now, -back);
      }
      if (when.dm && !when.explicitYear && date > now) date = new Date(date.getFullYear() - 1, date.getMonth(), date.getDate());
      ({ orig: o, folded: f } = blank(o, f, new RegExp(when.re.source, "g")));
    }

    // forma de pagamento
    let pay = "";
    for (const [name, re] of PAYMENTS) {
      if (re.test(f)) {
        pay = name;
        ({ orig: o, folded: f } = blank(o, f, new RegExp(re.source, "g")));
        break;
      }
    }

    // valores
    const amounts = [];
    f.replace(AMOUNT_RE, (m, num, mil, idx) => {
      let cents = parseMoney(num);
      if (cents && mil) cents *= 1000;
      if (cents) amounts.push({ cents, idx, len: m.length });
      return m;
    });
    if (!amounts.length) return null;

    // vários valores -> quebra em pedaços ("32 de uber e 187,50 no mercado")
    const pieces = [];
    for (let i = 0; i < amounts.length; i++) {
      const a = amounts[i];
      const to = i + 1 < amounts.length ? amounts[i + 1].idx : f.length;
      // texto antes do 1º valor e depois do último pertence ao pedaço
      // o texto entre dois valores vai até o " e " / "," / ";" (ou, sem separador, para o próximo)
      let segEnd = to;
      if (i + 1 < amounts.length) {
        const between = f.slice(a.idx + a.len, to);
        const sep = Math.max(between.lastIndexOf(" e "), between.lastIndexOf(", "), between.lastIndexOf(";"));
        segEnd = a.idx + a.len + Math.max(sep, 0);
      }
      const segStart = i === 0 ? 0 : pieces[i - 1].end;
      pieces.push({ cents: a.cents, start: segStart, end: segEnd, amtIdx: a.idx, amtLen: a.len });
    }

    return pieces.map((p) => {
      let po = o.slice(p.start, p.end), pf = f.slice(p.start, p.end);
      const rel = p.amtIdx - p.start;
      po = po.slice(0, rel) + " ".repeat(p.amtLen) + po.slice(rel + p.amtLen);
      pf = pf.slice(0, rel) + " ".repeat(p.amtLen) + pf.slice(rel + p.amtLen);
      const category = guessCategory(pf, kind, ctx.cats, ctx.learned || {});
      const desc = describe(po);
      return { kind, cents: p.cents, category, desc, date: ymd(date), pay };
    });
  }

  function parseTime(folded) {
    let m = folded.match(/\b(?:as |a )?(\d{1,2})(?::|h)(\d{2})\b/);
    let h, mi = 0, re;
    if (m) { h = +m[1]; mi = +m[2]; re = m[0]; }
    else if ((m = folded.match(/\b(?:as |a )?(\d{1,2}) ?h(?:oras?|rs?)?\b/))) { h = +m[1]; re = m[0]; }
    else if ((m = folded.match(/\b(?:as|a) (\d{1,2})(?! ?\/)\b(?: horas?)?/))) { h = +m[1]; re = m[0]; }
    else if ((m = folded.match(/\b(?:ao |as |a )?meio[- ]dia\b/))) { h = 12; re = m[0]; }
    else if ((m = folded.match(/\b(?:a )?meia[- ]noite\b/))) { h = 0; re = m[0]; }
    if (h == null || h > 23 || mi > 59) return null;
    let extra = "";
    const pm = folded.match(/\bda (tarde|noite)\b/);
    if (pm && h < 12) { h += 12; extra = pm[0]; }
    const am = folded.match(/\bda manha\b/);
    if (am) extra = am[0];
    return { h, mi, re, extra };
  }

  function parseReminder(text, now) {
    let o = text, f = fold(text);
    const strip = (re) => ({ orig: o, folded: f } = blank(o, f, re));

    // recorrência
    let rec = "nenhuma", recDay = null, recWeekday = null;
    let m;
    if ((m = f.match(/\b(?:todo |nos |em )?dias? ute(?:is|l)\b|\btodo dia util\b|\bde segunda a sexta\b/))) {
      rec = "dias_uteis"; strip(new RegExp(m[0], "g"));
    } else if ((m = f.match(/\btodo (?:santo )?dia (\d{1,2})\b|\btodo mes(?: no)? dia (\d{1,2})\b|\btodo dia (\d{1,2}) de cada mes\b/))) {
      rec = "mensal"; recDay = +(m[1] || m[2] || m[3]); strip(new RegExp(m[0], "g"));
    } else if ((m = f.match(/\btodos? (?:os )?dias?\b|\bdiariamente\b|\btoda noite\b|\btoda manha\b/))) {
      rec = "diaria"; strip(new RegExp(m[0], "g"));
    } else if ((m = f.match(new RegExp("\\btodas? (?:as |os )?" + WEEKDAY_RE + "s?\\b")))) {
      rec = "semanal"; recWeekday = WEEKDAYS.indexOf(m[1]); strip(new RegExp(m[0], "g"));
    } else if ((m = f.match(/\btoda semana\b|\bsemanalmente\b/))) {
      rec = "semanal"; strip(new RegExp(m[0], "g"));
    } else if ((m = f.match(/\btodo mes\b|\bmensalmente\b/))) {
      rec = "mensal"; strip(new RegExp(m[0], "g"));
    } else if ((m = f.match(/\btodo ano\b|\banualmente\b/))) {
      rec = "anual"; strip(new RegExp(m[0], "g"));
    }

    // "daqui 2 horas", "em 30 minutos"
    let when = null, explicitDay = false;
    if ((m = f.match(/\b(?:daqui(?: a)?|em|dentro de) (\d{1,3}) ?(minutos?|min|horas?|h|dias?)\b/))) {
      const n = +m[1], u = m[2];
      when = u.startsWith("d") ? addDays(now, n) : new Date(now.getTime() + n * (u.startsWith("h") ? 3600e3 : 60e3));
      when.setSeconds(0, 0);
      strip(new RegExp(m[0], "g"));
      explicitDay = true;
    }

    const time = when ? null : parseTime(f);
    if (time) { strip(new RegExp(time.re.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g")); if (time.extra) strip(new RegExp(time.extra, "g")); }

    if (!when) {
      const h = time ? time.h : 9, mi = time ? time.mi : 0;
      let day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const wd = recWeekday != null ? { weekday: recWeekday } : parseWhenDay(f, now);
      if (wd && recWeekday == null) strip(new RegExp(wd.re.source, "g"));
      if (recDay != null) {
        day = new Date(now.getFullYear(), now.getMonth(), recDay);
        explicitDay = true;
      } else if (wd) {
        explicitDay = true;
        if (wd.date) day = new Date(wd.date.getFullYear(), wd.date.getMonth(), wd.date.getDate());
        else if (wd.dayOfMonth) {
          day = new Date(now.getFullYear(), now.getMonth(), wd.dayOfMonth);
          if (new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, mi) <= now) day = new Date(now.getFullYear(), now.getMonth() + 1, wd.dayOfMonth);
        } else if (wd.weekday != null) {
          let ahead = (wd.weekday - now.getDay() + 7) % 7;
          const cand = addDays(day, ahead);
          if (ahead === 0 && new Date(cand.getFullYear(), cand.getMonth(), cand.getDate(), h, mi) <= now) ahead = 7;
          day = addDays(day, ahead);
        }
      }
      when = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, mi);
      // sem dia dito e o horário de hoje já passou -> amanhã (para lembretes únicos)
      if (!explicitDay && rec === "nenhuma" && when <= now) when = addDays(when, 1);
      if (rec !== "nenhuma") when = nextOccurrence(when, rec, now) || when;
    }

    // valor opcional ("pagar a luz de 180")
    let cents = null;
    const am = f.match(/(?:r\$\s*)?\b(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\b(?:\s*(?:reais|real))?/);
    if (am && /r\$|reais|real|,\d{2}\b/.test(am[0]) ) {
      cents = parseMoney(am[1]);
      if (cents) strip(new RegExp(am[0].replace(/[.*+?^${}()|[\]\\$]/g, "\\$&"), "g"));
    }

    // texto do lembrete: tira "me lembra de", "lembrete:", etc.
    strip(/\b(?:me |nos )?(?:lembr(?:a|e|ar|ete)s?|avis(?:a|e|ar)(?: me)?)(?: me)?\b:?/g);
    let t = cleanText(o).replace(/^(?:(?:de|que|para|pra|pro|do|da|a|o|eu|tenho que|preciso)\s+)+/i, "").replace(/\s+(?:de|para|pra|as|a|no|na|e)$/i, "").trim();
    t = t.charAt(0).toUpperCase() + t.slice(1);
    return { text: t, when: fmtLocal(when), rec, cents };
  }

  const REMINDER_RE = /\b(me lembr|lembr(a|e|ar|ete)\b|avis(a|e|ar) me|me avis)/;

  /** Entende uma frase livre. Retorna {type:"tx", items:[...]} | {type:"rem", ...} | null */
  function parseQuick(text, now, ctx) {
    const t = (text || "").trim();
    if (!t) return null;
    if (REMINDER_RE.test(fold(t))) {
      const r = parseReminder(t, now);
      return r.text ? { type: "rem", ...r } : null;
    }
    const items = parseTransactions(t, now, ctx);
    return items ? { type: "tx", items } : null;
  }

  // ---------- agenda (.ics) ----------
  function icsEscape(s) {
    return String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  }
  function icsDate(d) {
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  }
  function rrule(rec, start) {
    switch (rec) {
      case "diaria": return "FREQ=DAILY";
      case "dias_uteis": return "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR";
      case "semanal": return "FREQ=WEEKLY";
      case "mensal": {
        const d = start.getDate();
        if (d <= 28) return `FREQ=MONTHLY;BYMONTHDAY=${d}`;
        const days = []; for (let i = 28; i <= d; i++) days.push(i);
        return `FREQ=MONTHLY;BYMONTHDAY=${days.join(",")};BYSETPOS=-1`;
      }
      case "anual": return "FREQ=YEARLY";
      default: return null;
    }
  }
  function vevent(rem, stamp) {
    const start = parseLocal(rem.next || rem.start);
    const end = new Date(start.getTime() + 15 * 60e3);
    const lines = [
      "BEGIN:VEVENT",
      `UID:${rem.id}@minhas-contas`,
      `DTSTAMP:${stamp.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "")}`,
      `DTSTART:${icsDate(start)}`,
      `DTEND:${icsDate(end)}`,
      `SUMMARY:${icsEscape(rem.text)}`,
    ];
    if (rem.cents) lines.push(`DESCRIPTION:${icsEscape("Valor: " + brl(rem.cents))}`);
    const rr = rrule(rem.rec, start);
    if (rr) lines.push(`RRULE:${rr}`);
    lines.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(rem.text)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
    return lines;
  }
  /** Arquivo de agenda (.ics) com um ou vários lembretes; a agenda do celular avisa na hora. */
  function toICS(rems, stamp = new Date()) {
    const list = Array.isArray(rems) ? rems : [rems];
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Minhas Contas//PT-BR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
    for (const r of list) lines.push(...vevent(r, stamp));
    lines.push("END:VCALENDAR");
    return lines.join("\r\n") + "\r\n";
  }

  return {
    parseMoney, brl, ymd, fmtLocal, parseDate, parseLocal, addDays, addMonths, nextOccurrence, RECURRENCES,
    fold, parseQuick, parseTransactions, parseReminder, toICS, lastDayOfMonth, KEYWORDS,
  };
})();
</script>
<script>
"use strict";
const APP_VERSION = "1.2.0";
const KEY = "minhasContas.v1";
const SNAP_PREFIX = "minhasContas.snap.";
const { brl, ymd, fmtLocal, parseDate, parseLocal, addDays, nextOccurrence, RECURRENCES, fold, parseQuick, parseMoney, toICS } = Core;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const PAYS = ["pix", "crédito", "débito", "dinheiro", "boleto"];

const DEFAULT_CATS = {
  despesa: [
    ["mercado", "🛒"], ["alimentação", "🍽️"], ["transporte", "🚗"], ["moradia", "🏠"], ["contas", "💡"], ["saúde", "💊"],
    ["lazer", "🎉"], ["educação", "📚"], ["compras", "🛍️"], ["assinaturas", "📺"], ["pets", "🐾"], ["dívidas", "💳"], ["outros", "📦"],
  ].map(([name, icon]) => ({ name, icon })),
  receita: [["salário", "💼"], ["freelance", "🧑‍💻"], ["vendas", "🏷️"], ["investimentos", "📈"], ["outros", "💰"]].map(([name, icon]) => ({ name, icon })),
};

// ================= dados (salvos no próprio aparelho) =================
function emptyDb() {
  return { version: 2, tx: [], rem: [], debts: [], budgets: {}, cats: JSON.parse(JSON.stringify(DEFAULT_CATS)), learned: {}, meta: { created: Date.now() } };
}
function migrate(d) {
  // Aqui entram as conversões quando o formato dos dados mudar em versões futuras.
  d.version ??= 1;
  d.tx ??= []; d.rem ??= []; d.budgets ??= {}; d.learned ??= {}; d.meta ??= {};
  d.cats ??= JSON.parse(JSON.stringify(DEFAULT_CATS));
  for (const k of ["despesa", "receita"]) if (!d.cats[k]?.length) d.cats[k] = JSON.parse(JSON.stringify(DEFAULT_CATS[k]));
  // v2: controle de dívidas + categoria "dívidas"
  d.debts ??= [];
  for (const dv of d.debts) { dv.payments ??= []; dv.adjust ??= []; }
  if (!d.cats.despesa.some((c) => c.name === "dívidas")) {
    const i = d.cats.despesa.findIndex((c) => c.name === "outros");
    d.cats.despesa.splice(i < 0 ? d.cats.despesa.length : i, 0, { name: "dívidas", icon: "💳" });
  }
  d.version = Math.max(d.version, 2);
  return d;
}
let storageError = false;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? migrate(JSON.parse(raw)) : emptyDb();
  } catch (e) {
    storageError = true;
    return emptyDb();
  }
}
let db = load();

function persist() {
  try {
    db.meta.updated = Date.now();
    const json = JSON.stringify(db);
    localStorage.setItem(KEY, json);
    // cópia automática do dia (guarda os últimos 7 dias)
    const today = SNAP_PREFIX + ymd(new Date());
    localStorage.setItem(today, json);
    const snaps = Object.keys(localStorage).filter((k) => k.startsWith(SNAP_PREFIX)).sort();
    while (snaps.length > 7) localStorage.removeItem(snaps.shift());
    storageError = false;
  } catch (e) {
    storageError = true;
    toast("⚠️ Não consegui salvar no aparelho. Faça um backup em Mais → Backup.", { ms: 8000 });
  }
}
function commit() { persist(); render(); }

// outra aba/janela do app mudou os dados -> atualiza esta também
addEventListener("storage", (e) => {
  if (e.key === KEY && e.newValue) { db = migrate(JSON.parse(e.newValue)); render(); }
});

// pede ao navegador para não apagar os dados quando faltar espaço
navigator.storage?.persist?.().catch(() => {});

// ================= cálculos =================
const now = () => new Date();
function monthKey(y, m) { return `${y}-${String(m + 1).padStart(2, "0")}`; }
function txOfMonth(y, m) { const k = monthKey(y, m); return db.tx.filter((t) => t.date.startsWith(k)); }
function summarize(list) {
  const s = { inc: 0, exp: 0, byCat: { despesa: {}, receita: {} } };
  for (const t of list) {
    if (t.kind === "receita") s.inc += t.cents; else s.exp += t.cents;
    s.byCat[t.kind][t.category] = (s.byCat[t.kind][t.category] || 0) + t.cents;
  }
  return s;
}
function budgetStatus(y, m) {
  const spent = summarize(txOfMonth(y, m)).byCat.despesa;
  return Object.entries(db.budgets).filter(([, v]) => v > 0).map(([cat, limit]) => {
    const s = spent[cat] || 0;
    return { cat, limit, spent: s, pct: Math.round((100 * s) / limit) };
  }).sort((a, b) => b.pct - a.pct);
}
const level = (pct) => (pct >= 100 ? "crit" : pct >= 80 ? "warn" : "good");
const levelLabel = { good: "ok", warn: "atenção", crit: "estourou" };
function catIcon(name) { return (db.cats.despesa.find((c) => c.name === name) || db.cats.receita.find((c) => c.name === name) || { icon: "📦" }).icon; }
function catOf(kind, name) {
  return db.cats[kind].find((c) => c.name === name) || { name, icon: kind === "receita" ? "💰" : "📦" };
}
function catsForParse() { return { cats: db.cats, learned: db.learned }; }

function effWhen(r) { return r.snooze || r.next; }
function isDue(r, at = now()) { const e = effWhen(r); return !r.done && e && parseLocal(e) <= at; }
function dueReminders() { return db.rem.filter((r) => isDue(r)).sort((a, b) => effWhen(a).localeCompare(effWhen(b))); }

function fmtDay(dateStr) {
  const d = parseDate(dateStr), today = new Date();
  const diff = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - d) / 864e5);
  if (diff === 0) return "hoje";
  if (diff === 1) return "ontem";
  if (diff === -1) return "amanhã";
  return `${WD[d.getDay()]}, ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
}
function fmtWhen(local) {
  const d = parseLocal(local);
  return `${fmtDay(ymd(d))} às ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

// ================= ações =================
function learn(desc, category) {
  for (const w of fold(desc).split(/[^a-z0-9]+/)) {
    if (w.length >= 3 && !/^\d+$/.test(w)) db.learned[w] = category;
  }
  const keys = Object.keys(db.learned);
  if (keys.length > 600) for (const k of keys.slice(0, keys.length - 600)) delete db.learned[k];
}

function saveTx(t, { silent } = {}) {
  const before = t.kind === "despesa" ? pctOf(t.category, t.date) : null;
  const i = db.tx.findIndex((x) => x.id === t.id);
  if (i >= 0) db.tx[i] = t; else db.tx.push({ ...t, id: t.id || uid(), created: Date.now() });
  if (t.payId) {
    // editou no extrato um pagamento de dívida: atualiza a dívida também
    const pay = db.debts.find((d) => d.id === t.debtId)?.payments.find((x) => x.id === t.payId);
    if (pay) { pay.cents = t.cents; pay.date = t.date; }
  }
  if (t.desc) learn(t.desc, t.category);
  commit();
  if (silent) return;
  const after = t.kind === "despesa" ? pctOf(t.category, t.date) : null;
  if (after != null && before != null && level(after) !== "good" && level(after) !== level(before)) {
    toast(after >= 100 ? `⛔ Orçamento de ${t.category} estourou: ${after}%` : `⚠️ ${t.category} já usou ${after}% do orçamento`, { ms: 6000 });
  }
}
function pctOf(cat, date) {
  const limit = db.budgets[cat];
  if (!limit) return null;
  const d = parseDate(date);
  const spent = summarize(txOfMonth(d.getFullYear(), d.getMonth())).byCat.despesa[cat] || 0;
  return Math.round((100 * spent) / limit);
}
function deleteTx(id) {
  const i = db.tx.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [removed] = db.tx.splice(i, 1);
  const dv = removed.payId ? db.debts.find((d) => d.id === removed.debtId) : null;
  const pay = dv?.payments.find((x) => x.id === removed.payId);
  if (pay) { dv.payments = dv.payments.filter((x) => x !== pay); syncDebtReminder(dv); }
  commit();
  toast(pay ? `Lançamento e pagamento de “${dv.name}” apagados.` : "Lançamento apagado.", { action: "Desfazer", onAction: () => { db.tx.push(removed); if (pay) { dv.payments.push(pay); syncDebtReminder(dv); } commit(); } });
}

function saveRem(r) {
  const start = parseLocal(r.start);
  const nxt = nextOccurrence(start, r.rec, new Date(now().getTime() - 60e3)) || start;
  r.next = fmtLocal(nxt);
  r.done = false;
  r.snooze = null;
  r.notifiedFor = null;
  const i = db.rem.findIndex((x) => x.id === r.id);
  if (i >= 0) db.rem[i] = r; else db.rem.push({ ...r, id: r.id || uid(), created: Date.now() });
  commit();
}
function completeRem(id) {
  const r = db.rem.find((x) => x.id === id);
  if (!r) return;
  const at = new Date(Math.max(now().getTime(), parseLocal(r.next).getTime()));
  const nxt = r.rec === "nenhuma" ? null : nextOccurrence(parseLocal(r.start), r.rec, at);
  const prev = { ...r };
  r.snooze = null; r.notifiedFor = null; r.lastDone = fmtLocal(now());
  if (nxt) r.next = fmtLocal(nxt); else r.done = true;
  commit();
  const undo = () => { Object.assign(r, prev); commit(); };
  const dv = r.debtId ? db.debts.find((d) => d.id === r.debtId) : null;
  if (dv && !debtCalc(dv).done) {
    openDebtPaySheet(dv, { cents: r.cents });
  } else if (r.cents) {
    openPaySheet(r, undo);
  } else {
    toast(nxt ? `✅ Feito. Próximo: ${fmtWhen(r.next)}` : "✅ Lembrete concluído.", { action: "Desfazer", onAction: undo });
  }
}
function snoozeRem(id, minutes) {
  const r = db.rem.find((x) => x.id === id);
  if (!r) return;
  const base = new Date(now().getTime() + minutes * 60e3);
  base.setSeconds(0, 0);
  r.snooze = fmtLocal(base); r.notifiedFor = null;
  commit();
  toast(`Adiado para ${fmtWhen(r.snooze)}.`);
}
function deleteRem(id) {
  const i = db.rem.findIndex((x) => x.id === id);
  if (i < 0) return;
  const [removed] = db.rem.splice(i, 1);
  commit();
  toast("Lembrete apagado.", { action: "Desfazer", onAction: () => { db.rem.push(removed); commit(); } });
}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function addToCalendar(rems) {
  const list = Array.isArray(rems) ? rems : [rems];
  download(list.length === 1 ? "lembrete.ics" : "lembretes.ics", toICS(list), "text/calendar");
  toast("Abra o arquivo para adicionar à agenda do celular.", { ms: 5000 });
}

// ================= navegação =================
const PRIV_KEY = "minhasContas.privado";
const ui = { tab: "inicio", y: new Date().getFullYear(), m: new Date().getMonth(), filter: null, search: "", cols: "exp", lastTab: null,
  private: (() => { try { return localStorage.getItem(PRIV_KEY) === "1"; } catch { return false; } })() };
function go(tab) { ui.tab = tab; render(); scrollTo(0, 0); }
$$(".nav button[data-tab]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.tab === "extrato") { ui.y = new Date().getFullYear(); ui.m = new Date().getMonth(); }
  go(b.dataset.tab);
}));
$("#fab").addEventListener("click", () => (ui.tab === "lembretes" ? openRemSheet() : ui.tab === "dividas" ? openDebtSheet() : openTxSheet()));

function render() {
  $$(".nav button[data-tab]").forEach((b) => b.dataset.tab === ui.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.body.classList.toggle("privado", ui.private);
  const due = dueReminders().length;
  $("#badge").hidden = !due; $("#badge").textContent = due;
  try { if (due) navigator.setAppBadge?.(due)?.catch(() => {}); else navigator.clearAppBadge?.()?.catch(() => {}); } catch {}
  $("#fab").setAttribute("aria-label", ui.tab === "lembretes" ? "Novo lembrete" : ui.tab === "dividas" ? "Nova dívida" : "Novo lançamento");
  const lateDebts = db.debts.filter((dv) => debtCalc(dv).late).length;
  $("#badge-d").hidden = !lateDebts; $("#badge-d").textContent = lateDebts;

}

function statTile(tone, icon, label, value, hint) {
  return `<div class="stat"><span class="ic ${tone}" aria-hidden="true">${icon}</span><span class="label">${label}</span>
    <span class="value money">${value}</span><span class="hint">${esc(hint)}</span></div>`;
}

function monthStats(y, m) {
  const today = now();
  const isCurrent = y === today.getFullYear() && m === today.getMonth();
  const dim = Core.lastDayOfMonth(y, m);
  const day = isCurrent ? today.getDate() : dim;
  const list = txOfMonth(y, m);
  const sum = summarize(list);
  const avg = Math.round(sum.exp / day);
  const forecast = isCurrent ? Math.round((sum.exp / day) * dim) : sum.exp;
  const left = dim - day + 1;
  const free = sum.inc - sum.exp;
  const perDay = free > 0 ? Math.floor(free / left / 100) * 100 : 0;
  const biggest = list.filter((t) => t.kind === "despesa").sort((a, b) => b.cents - a.cents)[0];
  const pm = new Date(y, m - 1, 1);
  const prevDim = Core.lastDayOfMonth(pm.getFullYear(), pm.getMonth());
  const prevSame = txOfMonth(pm.getFullYear(), pm.getMonth())
    .filter((t) => t.kind === "despesa" && Number(t.date.slice(8)) <= Math.min(day, prevDim))
    .reduce((a, t) => a + t.cents, 0);
  return { sum, dim, day, avg, forecast, left, perDay, biggest, prevSame, prevDim, isCurrent };
}

function cumulative(y, m, upTo) {
  const dim = Core.lastDayOfMonth(y, m);
  const perDay = new Array(dim).fill(0);
  for (const t of txOfMonth(y, m)) if (t.kind === "despesa") perDay[Number(t.date.slice(8)) - 1] += t.cents;
  let acc = 0;
  return perDay.map((v, i) => (i + 1 > upTo ? null : (acc += v)));
}

function catBars(byCat, limit) {
  const items = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (!items.length) return `<p class="empty">Sem gastos neste mês.</p>`;
  const top = items[0][1], total = items.reduce((a, [, v]) => a + v, 0);
  let shown = items;
  if (limit && items.length > limit) {
    const rest = items.slice(limit - 1).reduce((a, [, v]) => a + v, 0);
    shown = [...items.slice(0, limit - 1), ["__resto", rest]];
  }
  return `<div class="bars">${shown.map(([cat, v]) => {
    const rest = cat === "__resto";
    const name = rest ? `outras ${items.length - limit + 1} categorias` : cat;
    return `<button class="bar-row" ${rest ? 'data-go="extrato"' : `data-cat="${esc(cat)}"`} aria-label="${esc(name)}: ${brl(v)}">
      <span class="ico" aria-hidden="true">${rest ? "•••" : catOf("despesa", cat).icon}</span>
      <span class="bar-line"><span class="name">${esc(name)}</span><span><span class="val money">${brl(v)}</span><span class="pct">${Math.round((100 * v) / total)}%</span></span></span>
      <span class="track"><span class="fill" style="width:${((100 * v) / top).toFixed(1)}%"></span></span>
    </button>`;
  }).join("")}</div>`;
}

// ================= gráficos (SVG desenhado no tamanho da tela) =================
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs = {}, parent) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}
function niceStep(raw) {
  const exp = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / exp;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
}
function brlShort(cents) {
  const v = cents / 100;
  if (v >= 1000) return `R$ ${(v / 1000).toFixed(v >= 10000 || v % 1000 === 0 ? 0 : 1).replace(".", ",")} mil`;
  return `R$ ${Math.round(v)}`;
}
function makeTip(chart) {
  const tip = document.createElement("div");
  tip.className = "tip";
  chart.appendChild(tip);
  return tip;
}
function tipRows(tip, head, rows) {
  tip.replaceChildren();
  const hd = document.createElement("div");
  hd.className = "t-head";
  hd.textContent = head;
  tip.appendChild(hd);
  for (const r of rows) {
    const row = document.createElement("div");
    row.className = "t-row";
    if (r.color) { const k = document.createElement("i"); k.className = "key"; k.style.background = r.color; row.appendChild(k); }
    const b = document.createElement("b");
    b.textContent = ui.private ? "R$ •••" : r.value;
    row.appendChild(b);
    row.appendChild(document.createTextNode(" " + r.label));
    tip.appendChild(row);
  }
}
function placeTip(chart, tip, x) {
  const w = chart.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(w - tw, x - tw / 2)) + "px";
  tip.style.top = "-6px";
}
function bindPointer(chart, onMove, steps) {
  let hideTimer;
  const move = (e) => {
    const r = chart.getBoundingClientRect();
    clearTimeout(hideTimer);
    chart.classList.add("active");
    onMove(e.clientX - r.left);
  };
  chart.addEventListener("pointerdown", move);
  chart.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) move(e); });
  chart.addEventListener("pointerleave", () => chart.classList.remove("active"));
  chart.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") hideTimer = setTimeout(() => chart.classList.remove("active"), 2500); });
  let k = -1;
  chart.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    k = Math.max(0, Math.min(steps.length - 1, (k < 0 ? steps.length - 1 : k) + (e.key === "ArrowRight" ? 1 : -1)));
    chart.classList.add("active");
    onMove(steps[k]);
  });
  chart.addEventListener("blur", () => chart.classList.remove("active"));
}

function drawPace(chart) {
  const d = now(), y = d.getFullYear(), m = d.getMonth();
  const pm = new Date(y, m - 1, 1);
  const cur = cumulative(y, m, d.getDate());
  const prev = cumulative(pm.getFullYear(), pm.getMonth(), 99);
  const W = chart.clientWidth || 320, H = 176;
  const L = 46, R = 14, T = 34, B = 24;
  const pw = W - L - R, ph = H - T - B;
  const xmax = Math.max(cur.length, prev.length);
  const maxV = Math.max(1, ...cur.filter((v) => v != null), ...prev);
  const step = niceStep(maxV / 3 / 100) * 100;
  const ymax = Math.max(step, Math.ceil(maxV / step) * step);
  const X = (i) => L + (pw * i) / (xmax - 1);
  const Y = (v) => T + ph - (ph * v) / ymax;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img" });
  svg.setAttribute("aria-hidden", "true");
  for (let v = 0; v <= ymax + 1; v += step) {
    svgEl("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: "grid" }, svg);
    svgEl("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", class: "axis money" }, svg).textContent = v ? brlShort(v) : "0";
  }
  for (const day of [1, 10, 20, xmax]) svgEl("text", { x: X(day - 1), y: H - 6, "text-anchor": day === 1 ? "start" : day === xmax ? "end" : "middle", class: "axis" }, svg).textContent = day;
  const path = (arr) => arr.map((v, i) => (v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`)).filter(Boolean);
  const pp = path(prev);
  if (pp.length > 1) svgEl("polyline", { points: pp.join(" "), fill: "none", stroke: "var(--ghost)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  const cp = path(cur);
  const lastI = cur.reduce((a, v, i) => (v != null ? i : a), 0);
  if (cp.length > 1) {
    svgEl("polygon", { points: `${X(0)},${Y(0)} ${cp.join(" ")} ${X(lastI)},${Y(0)}`, fill: "var(--accent-wash)" }, svg);
    svgEl("polyline", { points: cp.join(" "), fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }
  const ex = X(lastI), ey = Y(cur[lastI] || 0);
  svgEl("circle", { cx: ex, cy: ey, r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  const lbl = svgEl("text", { x: Math.min(ex, W - R), y: ey - 10, "text-anchor": ex > W - 80 ? "end" : "middle", class: "lbl money" }, svg);
  lbl.textContent = brl(cur[lastI] || 0);
  const hair = svgEl("line", { y1: T - 4, y2: T + ph, class: "hair" }, svg);
  const dotC = svgEl("circle", { r: 4, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }, svg);
  const dotP = svgEl("circle", { r: 4, fill: "var(--ghost)", stroke: "var(--surface)", "stroke-width": 2, opacity: 0 }, svg);
  chart.replaceChildren(svg);
  const tip = makeTip(chart);
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--accent").trim(), ghost = cs.getPropertyValue("--ghost").trim();
  const show = (px) => {
    const i = Math.max(0, Math.min(xmax - 1, Math.round(((px - L) / pw) * (xmax - 1))));
    const x = X(i);
    hair.setAttribute("x1", x); hair.setAttribute("x2", x);
    const rows = [];
    if (cur[i] != null) { dotC.setAttribute("cx", x); dotC.setAttribute("cy", Y(cur[i])); dotC.setAttribute("opacity", 1); rows.push({ color: accent, value: brl(cur[i]), label: MONTHS[m].slice(0, 3) }); }
    else dotC.setAttribute("opacity", 0);
    if (prev[i] != null) { dotP.setAttribute("cx", x); dotP.setAttribute("cy", Y(prev[i])); dotP.setAttribute("opacity", 1); rows.push({ color: ghost, value: brl(prev[i]), label: MONTHS[pm.getMonth()].slice(0, 3) }); }
    else dotP.setAttribute("opacity", 0);
    tipRows(tip, `Até o dia ${i + 1}`, rows);
    placeTip(chart, tip, x);
  };
  bindPointer(chart, show, Array.from({ length: xmax }, (_, i) => X(i)));
}

function drawMonths(chart) {
  const d = now();
  const months = [];
  for (let k = 5; k >= 0; k--) {
    const dt = new Date(d.getFullYear(), d.getMonth() - k, 1);
    const s = summarize(txOfMonth(dt.getFullYear(), dt.getMonth()));
    months.push({ y: dt.getFullYear(), m: dt.getMonth(), inc: s.inc, exp: s.exp });
  }
  const key = ui.cols === "inc" ? "inc" : "exp";
  const W = chart.clientWidth || 320, H = 168;
  const L = 6, R = 6, T = 28, B = 24;
  const pw = W - L - R, ph = H - T - B;
  const slot = pw / months.length;
  const bw = Math.min(24, slot * 0.5);
  const maxV = Math.max(1, ...months.map((x) => x[key]));
  const Y = (v) => T + ph - (ph * v) / maxV;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, height: H });
  svg.setAttribute("aria-hidden", "true");
  svgEl("line", { x1: L, x2: W - R, y1: T + ph + 0.5, y2: T + ph + 0.5, class: "grid" }, svg);
  const maxIdx = months.reduce((a, x, i) => (x[key] > months[a][key] ? i : a), 0);
  const bars = [];
  months.forEach((mo, i) => {
    const cx = L + slot * i + slot / 2;
    const v = mo[key], top = Y(v), h = T + ph - top;
    const isCur = i === months.length - 1;
    if (v > 0) {
      const r = Math.min(4, h, bw / 2), x0 = cx - bw / 2, x1 = cx + bw / 2, yb = T + ph;
      svgEl("path", { d: `M${x0},${yb} V${top + r} Q${x0},${top} ${x0 + r},${top} H${x1 - r} Q${x1},${top} ${x1},${top + r} V${yb} Z`, fill: "var(--accent)", opacity: isCur ? 1 : 0.38, class: "bar" }, svg);
    }
    if (v > 0 && (isCur || i === maxIdx)) svgEl("text", { x: cx, y: top - 7, "text-anchor": "middle", class: "lbl money" }, svg).textContent = brlShort(v);
    svgEl("text", { x: cx, y: H - 6, "text-anchor": "middle", class: "axis", "font-weight": isCur ? 700 : 400 }, svg).textContent = MONTHS[mo.m].slice(0, 3);
    bars.push(cx);
  });
  const hl = svgEl("rect", { y: T - 4, height: ph + 4, width: slot - 4, rx: 10, fill: "var(--accent-wash)", opacity: 0 }, svg);
  svg.insertBefore(hl, svg.firstChild);
  chart.replaceChildren(svg);
  const tip = makeTip(chart);
  const cs = getComputedStyle(document.documentElement);
  const show = (px) => {
    const i = Math.max(0, Math.min(months.length - 1, Math.floor((px - L) / slot)));
    const mo = months[i];
    hl.setAttribute("x", L + slot * i + 2); hl.setAttribute("opacity", 1);
    tipRows(tip, `${MONTHS[mo.m]} ${mo.y}`, [
      { value: brl(mo.inc), label: "entrou" },
      { value: brl(mo.exp), label: "saiu" },
      { value: brl(mo.inc - mo.exp), label: "saldo" },
    ]);
    placeTip(chart, tip, bars[i]);
  };
  chart.addEventListener("pointerleave", () => hl.setAttribute("opacity", 0));
  bindPointer(chart, show, bars);
}

function drawCharts() {
  for (const el of $$("[data-chart]")) {
    try { (el.dataset.chart === "pace" ? drawPace : drawMonths)(el); } catch (e) { console.warn("gráfico", e); }
  }
}
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 150); });

function txRow(t) {
  const c = catOf(t.kind, t.category);
  const sub = [fmtDay(t.date), t.category, t.pay].filter(Boolean).join(" · ");
  return `<button class="row" data-tx="${t.id}">
    <span class="ico" aria-hidden="true">${c.icon}</span>
    <span class="main"><span class="title" style="display:block">${esc(t.desc || t.category)}</span><span class="sub" style="display:block">${esc(sub)}</span></span>
    <span class="amt money ${t.kind === "receita" ? "inc" : ""}">${t.kind === "receita" ? "+" : "−"} ${brl(t.cents)}</span>
  </button>`;
}

function remRow(r) {
  const due = isDue(r);
  const when = effWhen(r);
  const sub = [when ? fmtWhen(when) : "concluído", r.rec !== "nenhuma" ? RECURRENCES[r.rec].toLowerCase() : "", r.cents ? brl(r.cents) : "", r.snooze ? "adiado" : ""].filter(Boolean).join(" · ");
  return `<div class="row" data-rem="${r.id}" role="button" tabindex="0">
    <span class="ico" aria-hidden="true">${r.done ? "✔️" : due ? "🔔" : "⏰"}</span>
    <span class="main"><span class="title" style="display:block">${esc(r.text)}</span><span class="sub ${due ? "due" : ""}" style="display:block">${due ? "Agora · " : ""}${esc(sub)}</span></span>
    ${!r.done ? `<span class="rem-actions">${due ? `<button class="btn" data-snooze="${r.id}" aria-label="Adiar 1 hora">+1h</button>` : ""}<button class="btn ${due ? "primary" : ""}" data-done="${r.id}">Feito</button></span>` : ""}
  </div>`;
}

function viewExtrato() {
  const { y, m } = ui;
  const all = txOfMonth(y, m);
  const s = summarize(all);
  const budgets = budgetStatus(y, m);
  const usedCats = [...new Set(all.map((t) => t.category))];
  const q = fold(ui.search || "");
  const list = all.filter((t) => (!ui.filter || t.category === ui.filter) && (!q || fold(`${t.desc} ${t.category} ${t.pay}`).includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  const byDay = {};
  for (const t of list) (byDay[t.date] ??= []).push(t);

  return `
  <div class="month-nav">
    <button class="icon-btn" data-month="-1" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1>${MONTHS[m]} ${y}</h1>
    <button class="icon-btn" data-month="1" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="tiles">
    <div class="tile"><div class="label">Receitas</div><div class="value money">${brl(s.inc)}</div></div>
    <div class="tile"><div class="label">Despesas</div><div class="value money">${brl(s.exp)}</div></div>
    <div class="tile"><div class="label">Saldo</div><div class="value money">${brl(s.inc - s.exp)}</div></div>
  </div>

  <section class="card"><h2>Despesas por categoria</h2>${catBars(s.byCat.despesa)}</section>

  <section class="card"><div class="card-head"><h2>Orçamentos</h2><button class="link" data-go="mais">Definir</button></div>
    ${budgets.length ? `<div class="bars">${budgets.map((b) => `
      <div class="bar-plain">
        <span class="bar-line"><span class="name">${catOf("despesa", b.cat).icon} ${esc(b.cat)} <span class="status ${level(b.pct)}">${levelLabel[level(b.pct)]}</span></span><span class="val money">${brl(b.spent)} de ${brl(b.limit)}</span></span>
        <span class="track"><span class="fill ${level(b.pct)}" style="display:block;width:${Math.min(b.pct, 100)}%"></span></span>
      </div>`).join("")}</div>` : `<p class="empty">Defina um limite mensal por categoria em Mais → Orçamentos.</p>`}
  </section>

  <section class="card">
    <div class="card-head"><h2>Lançamentos (${list.length})</h2></div>
    <label class="sr" for="search">Buscar</label><input id="search" class="search" type="search" placeholder="Buscar descrição, categoria…" value="${esc(ui.search)}">
    ${usedCats.length > 1 ? `<div class="chips" role="group" aria-label="Filtrar por categoria">
      <button class="chip" data-filter="" aria-pressed="${!ui.filter}">Todas</button>
      ${usedCats.map((c) => `<button class="chip" data-filter="${esc(c)}" aria-pressed="${ui.filter === c}">${catIcon(c)} ${esc(c)}</button>`).join("")}
    </div>` : ""}
    ${list.length ? Object.entries(byDay).map(([day, ts]) => {
      const tot = ts.reduce((a, t) => a + (t.kind === "receita" ? t.cents : -t.cents), 0);
      return `<div class="day-head"><span>${fmtDay(day)}</span><span class="money">${brl(tot, { plus: true })}</span></div><div class="list">${ts.map(txRow).join("")}</div>`;
    }).join("") : `<p class="empty">Nenhum lançamento${ui.filter || ui.search ? " com esse filtro" : " neste mês"}.</p>`}
  </section>`;
}

function viewLembretes() {
  const active = db.rem.filter((r) => !r.done).sort((a, b) => effWhen(a).localeCompare(effWhen(b)));
  const due = active.filter((r) => isDue(r));
  const later = active.filter((r) => !isDue(r));
  const done = db.rem.filter((r) => r.done).sort((a, b) => (b.lastDone || "").localeCompare(a.lastDone || "")).slice(0, 10);
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  return `
  <header class="top"><div><p class="hello">Avisos e contas</p><h1>Lembretes</h1></div>
    <div class="top-actions">${active.length ? `<button class="icon-btn ghost" id="all-cal" aria-label="Pôr todos na agenda">📅</button>` : ""}<button class="icon-btn ghost" id="settings" aria-label="Configurações">${ICON.gear}</button></div></header>
  ${perm === "default" ? `<div class="alert info">🔔 <span>Quer que o app avise na hora? <button class="link" id="ask-notif">Ativar avisos</button></span></div>` : ""}
  <div class="alert info">📅 <span>Para o celular avisar <b>mesmo com o app fechado</b>, toque no lembrete e em “Pôr na agenda”. A agenda do celular avisa sem internet.</span></div>
  ${due.length ? `<section class="card"><h2 class="due">Agora (${due.length})</h2><div class="list">${due.map(remRow).join("")}</div></section>` : ""}
  <section class="card"><h2>Próximos</h2>

}

let installPrompt = null;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installPrompt = e; if (ui.tab === "mais") render(); });
